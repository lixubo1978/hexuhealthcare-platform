<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台费用录入｜荷序健康</title><style>
:root{--g:#0b5051;--c:#f4f0e6;--p:#fffcf7;--l:#d3dcd4}*{box-sizing:border-box}body{margin:0;background:var(--c);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#233633}button,input,select,textarea{font:inherit}.top{height:88px;background:var(--p);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{display:flex;align-items:center;gap:12px;color:var(--g);font-size:23px;font-weight:650;letter-spacing:3px}.brand img{width:44px}.btn{height:40px;padding:0 14px;border:1px solid var(--g);background:#fff;color:var(--g)}.primary{background:var(--g);color:#fff}.layout{display:flex}.side{width:240px;min-height:calc(100vh - 88px);background:var(--g);padding:22px 12px}.side a{display:block;padding:11px;color:#e2eae1;text-decoration:none}.side .active{background:var(--p);color:var(--g)}main{flex:1;min-width:0;padding:28px 32px}.hero{background:var(--g);color:#fff;padding:26px 30px}.hero p{font-size:12px;color:#c7d9cf}.box{background:var(--p);border:1px solid var(--l);margin-top:16px}.toolbar{padding:18px}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick .primary{margin-left:auto}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.5fr auto;gap:10px;margin-top:14px}.f label{display:block;font-size:10px;color:#64716a;margin-bottom:5px}.f input,.f select,.f textarea{width:100%;border:1px solid var(--l);padding:9px}.f input,.f select{height:40px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{background:var(--p);border:1px solid var(--l);padding:17px}.value{font-size:24px;font-weight:700;color:var(--g)}.head{padding:15px 18px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.cats{display:grid;grid-template-columns:repeat(5,1fr)}.cat{padding:15px;border-right:1px solid var(--l);border-bottom:1px solid var(--l)}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:11px;border-bottom:1px solid #e3e8e3;text-align:left;font-size:12px;white-space:nowrap}th{background:var(--c)}td.desc{white-space:normal}.mask{display:none;position:fixed;inset:0;background:#103537aa;z-index:50;align-items:center;justify-content:center}.mask.show{display:flex}.modal{width:min(720px,94%);background:var(--p)}.mh{background:var(--g);color:#fff;padding:18px;display:flex;justify-content:space-between}.form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.form textarea{min-height:90px}.actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.loading{position:fixed;inset:0;background:var(--c);z-index:99;display:flex;align-items:center;justify-content:center;color:var(--g)}@media(max-width:900px){.side{display:none}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:14px}.stats,.filters,.form,.cats{grid-template-columns:1fr}.full{grid-column:1}.top{padding:0 14px}.back{display:none}}</style></head><body><div id="loading" class="loading">正在验证平台权限...</div><header class="top"><div class="brand"><img src="./logo.jpeg">荷序健康</div><div><button class="btn back" onclick="location.href='wholemanagement.html'">返回管理首页</button> <button class="btn primary" onclick="logout()">退出登录</button></div></header><div class="layout"><aside class="side"><a href="wholemanagement.html">🏠 管理首页</a><a class="active">💳 平台费用录入</a></aside><main><section class="hero"><small>HEXU PLATFORM EXPENSES</small><h1>平台费用录入与使用统计</h1><p>费用流水、指定期间查询和分类统计；录入错误采用作废方式保留历史痕迹。</p></section>
<section class="box toolbar"><div class="quick"><button class="btn" onclick="period('month')">本月</button><button class="btn" onclick="period('last')">上月</button><button class="btn" onclick="period('quarter')">本季度</button><button class="btn" onclick="period('year')">本年度</button><button class="btn" onclick="period('all')">全部</button><button class="btn primary" onclick="openEntry()">＋ 录入费用</button></div><div class="filters"><div class="f"><label>开始日期</label><input id="from" type="date"></div><div class="f"><label>结束日期</label><input id="to" type="date"></div><div class="f"><label>费用类别</label><select id="category"><option value="">全部类别</option></select></div><div class="f"><label>状态</label><select id="status"><option value="active">有效流水</option><option value="all">全部</option><option value="void">已作废</option></select></div><div class="f"><label>关键词</label><input id="keyword"></div><button class="btn primary" onclick="loadData()">查询</button></div></section>
<section class="stats"><div class="stat">期间有效费用总额<div id="total" class="value">¥0.00</div></div><div class="stat">有效费用笔数<div id="count" class="value">0</div></div><div class="stat">最大单笔费用<div id="max" class="value">¥0.00</div></div><div class="stat">日均费用<div id="daily" class="value">¥0.00</div></div></section><section class="box"><div class="head"><strong>费用分类汇总</strong><small id="range"></small></div><div id="cats" class="cats"></div></section><section class="box"><div class="head"><strong>费用流水</strong><small id="result"></small></div><div class="table"><table><thead><tr><th>日期</th><th>费用编号</th><th>类别</th><th>金额</th><th>收款方</th><th>支付方式</th><th>经办人</th><th>费用说明</th><th>状态</th><th>录入时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div></section></main></div><div id="mask" class="mask"><div class="modal"><div class="mh"><strong>录入平台费用</strong><button class="btn" onclick="closeEntry()">×</button></div><div class="form"><div class="f"><label>费用日期 *</label><input id="eDate" type="date"></div><div class="f"><label>费用类别 *</label><select id="eCategory"></select></div><div class="f"><label>金额 *</label><input id="eAmount" type="number" min=".01" step=".01"></div><div class="f"><label>支付方式</label><select id="eMethod"><option>银行转账</option><option>微信</option><option>支付宝</option><option>现金</option><option>银行卡</option><option>其他</option></select></div><div class="f"><label>收款方</label><input id="ePayee"></div><div class="f"><label>经办人</label><input id="eHandler"></div><div class="f full"><label>费用说明 *</label><textarea id="eDesc"></textarea></div><div class="f full"><label>备注</label><textarea id="eRemark"></textarea></div><div class="actions"><button class="btn" onclick="closeEntry()">取消</button><button id="save" class="btn primary" onclick="saveExpense()">保存</button></div></div></div></div><script>const KEY="sb-qbuqjwpkltbjhlfbyjyb-auth-token",CATS=["服务器/软件","广告推广","办公费用","差旅交通","人员薪酬","房租物业","专业服务","税费","设备采购","其他"],$=id=>document.getElementById(id);
function ses(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch{return null}}function tok(){return ses()?.access_token||""}function money(n){return "¥"+Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})}function esc(v){return String(v??"").replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))}
async function api(path,o={}){const h={Accept:"application/json",Authorization:"Bearer "+tok()};if(o.body!==undefined)h["Content-Type"]="application/json";const r=await fetch(path,{method:o.method||"GET",headers:h,body:o.body===undefined?undefined:JSON.stringify(o.body),cache:"no-store"}),t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.error||"请求失败");return d}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function period(x){const n=new Date(),y=n.getFullYear(),m=n.getMonth();if(x==="all"){$("from").value=$("to").value=""}else if(x==="month"){$("from").value=ds(new Date(y,m,1));$("to").value=ds(new Date(y,m+1,0))}else if(x==="last"){$("from").value=ds(new Date(y,m-1,1));$("to").value=ds(new Date(y,m,0))}else if(x==="quarter"){const q=Math.floor(m/3)*3;$("from").value=ds(new Date(y,q,1));$("to").value=ds(new Date(y,q+3,0))}else{$("from").value=ds(new Date(y,0,1));$("to").value=ds(new Date(y,11,31))}loadData()}
async function init(){try{if(!tok())return location.replace("login.html");const d=await api("/api/auth/business-identity");if(!d.profile||!["founder","platform_admin"].includes(d.profile.role))return location.replace("wholemanagement.html");const o=CATS.map(x=>`<option>${x}</option>`).join("");$("category").insertAdjacentHTML("beforeend",o);$("eCategory").innerHTML=o;$("loading").style.display="none";period("month")}catch(e){alert(e.message);location.replace("login.html")}}
async function loadData(){try{const q=new URLSearchParams({from:$("from").value,to:$("to").value,category:$("category").value,status:$("status").value,keyword:$("keyword").value}),d=await api("/api/admin/platform-expenses/list?"+q),s=d.summary||{};$("total").textContent=money(s.total);$("count").textContent=s.count||0;$("max").textContent=money(s.max_amount);$("daily").textContent=money(s.daily_average);$("range").textContent=[$("from").value,$("to").value].filter(Boolean).join(" 至 ")||"全部期间";$("cats").innerHTML=Object.entries(s.category_summary||{}).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="cat">${esc(x[0])}<br><b>${money(x[1])}</b></div>`).join("")||'<div class="cat">暂无有效费用</div>';$("result").textContent=`共 ${(d.expenses||[]).length} 条`;$("tbody").innerHTML=(d.expenses||[]).map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.expense_no)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.payee||"—")}</td><td>${esc(x.payment_method||"—")}</td><td>${esc(x.handler_name||"—")}</td><td class="desc">${esc(x.description)}</td><td>${x.status==="active"?"有效":"已作废"}</td><td>${new Date(x.created_at).toLocaleString("zh-CN",{hour12:false})}</td><td>${x.status==="active"?`<button class="btn" onclick="voidExpense(${x.id})">作废</button>`:esc(x.void_reason||"—")}</td></tr>`).join("")||'<tr><td colspan="11" style="text-align:center">当前期间没有费用流水</td></tr>'}catch(e){alert(e.message)}}
function openEntry(){$("eDate").value=ds(new Date());["eAmount","ePayee","eHandler","eDesc","eRemark"].forEach(x=>$(x).value="");$("mask").classList.add("show")}function closeEntry(){$("mask").classList.remove("show")}
async function saveExpense(){const b={expense_date:$("eDate").value,category:$("eCategory").value,amount:$("eAmount").value,payment_method:$("eMethod").value,payee:$("ePayee").value,handler_name:$("eHandler").value,description:$("eDesc").value,remark:$("eRemark").value};try{$("save").disabled=true;await api("/api/admin/platform-expenses/create",{method:"POST",body:b});closeEntry();await loadData()}catch(e){alert(e.message)}finally{$("save").disabled=false}}
async function voidExpense(id){const reason=prompt("请输入作废原因：");if(!reason)return;try{await api("/api/admin/platform-expenses/void",{method:"POST",body:{id,reason}});await loadData()}catch(e){alert(e.message)}}function logout(){localStorage.removeItem(KEY);location.replace("login.html")}document.addEventListener("DOMContentLoaded",init);</script></body></html>
