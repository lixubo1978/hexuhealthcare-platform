<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>服务评价 - 荷序健康</title>

    

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --pink: #ff6f9f;
            --pink-dark: #ef4f87;
            --pink-light: #fff0f5;
            --pink-soft: #fff7fa;
            --text: #4d3540;
            --muted: #a08791;
            --border: #f2dce5;
            --white: #ffffff;
            --yellow: #ffb84d;
            --shadow: 0 8px 28px rgba(220, 90, 135, 0.10);
        }

        html,
        body {
            min-height: 100%;
            background: #fff8fb;
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "PingFang SC",
                "Microsoft YaHei",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        body {
            padding-bottom:
                calc(30px + env(safe-area-inset-bottom));
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            background: var(--pink-soft);
            box-shadow: 0 0 30px rgba(0,0,0,.04);
        }

        /* =========================
           顶部
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 20;

            min-height: 62px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                calc(8px + env(safe-area-inset-top))
                16px
                8px;

            background: rgba(255,255,255,.96);

            border-bottom:
                1px solid var(--border);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header-side {
            width: 76px;
            display: flex;
            align-items: center;
        }

        .header-side.right {
            justify-content: flex-end;
        }

        .back-btn {
            min-width: 48px;
            min-height: 44px;

            border: none;
            background: transparent;

            color: var(--pink-dark);

            font-size: 15px;
            font-weight: 700;
        }

        .title {
            flex: 1;

            text-align: center;

            font-size: 18px;
            font-weight: 800;

            color: #543943;
        }

        /* =========================
           主体
        ========================= */

        .content {
            padding: 16px;
        }

        .card {
            margin-bottom: 14px;

            padding: 18px;

            background: var(--white);

            border:
                1px solid var(--border);

            border-radius: 20px;

            box-shadow: var(--shadow);
        }

        .card-title {
            margin-bottom: 14px;

            font-size: 16px;
            font-weight: 800;
        }

        .order-number {
            display: inline-flex;
            align-items: center;

            min-height: 30px;

            padding: 4px 10px;

            margin-bottom: 14px;

            border-radius: 999px;

            background: var(--pink-light);

            color: var(--pink-dark);

            font-size: 12px;
            font-weight: 700;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 16px;

            padding: 8px 0;

            border-bottom:
                1px dashed #f3e5ea;

            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            flex: 0 0 auto;

            color: var(--muted);
        }

        .info-value {
            max-width: 68%;

            text-align: right;

            font-weight: 700;

            word-break: break-word;
        }

        .amount {
            color: var(--pink-dark);

            font-size: 17px;
        }

        /* =========================
           评分
        ========================= */

        .rating-section {
            text-align: center;

            padding: 6px 0 4px;
        }

        .rating-title {
            margin-bottom: 5px;

            font-size: 17px;
            font-weight: 800;
        }

        .rating-subtitle {
            margin-bottom: 16px;

            font-size: 13px;

            color: var(--muted);
        }

        .stars {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 8px;

            margin-bottom: 12px;
        }

        .star {
            width: 50px;
            height: 50px;

            border: none;

            background: transparent;

            color: #eadde2;

            font-size: 38px;
            line-height: 50px;

            transition:
                transform .15s ease,
                color .15s ease;
        }

        .star.active {
            color: #ffb545;
        }

        .star:active {
            transform: scale(.88);
        }

        .rating-text {
            min-height: 24px;

            color: var(--pink-dark);

            font-size: 15px;
            font-weight: 800;
        }

        /* =========================
           标签
        ========================= */

        .field-label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 800;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;

            gap: 9px;

            margin-top: 10px;
        }

        .tag {
            min-height: 40px;

            padding: 8px 13px;

            border:
                1px solid var(--border);

            border-radius: 999px;

            background: #fff;

            color: #735963;

            font-size: 13px;
        }

        .tag.active {
            background: var(--pink-light);

            border-color: var(--pink);

            color: var(--pink-dark);

            font-weight: 700;
        }

        /* =========================
           文本
        ========================= */

        .textarea-wrap {
            position: relative;
        }

        textarea {
            width: 100%;

            min-height: 130px;

            resize: vertical;

            padding: 14px;
            padding-bottom: 34px;

            border:
                1px solid var(--border);

            border-radius: 16px;

            outline: none;

            background: #fffafb;

            color: var(--text);

            font-size: 15px;
            line-height: 1.6;
        }

        textarea:focus {
            border-color: var(--pink);

            box-shadow:
                0 0 0 3px
                rgba(255,111,159,.10);
        }

        .counter {
            position: absolute;

            right: 12px;
            bottom: 10px;

            color: var(--muted);

            font-size: 12px;
        }

        /* =========================
           匿名
        ========================= */

        .anonymous-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 14px;
        }

        .anonymous-title {
            margin-bottom: 4px;

            font-size: 15px;
            font-weight: 800;
        }

        .anonymous-desc {
            font-size: 12px;
            line-height: 1.5;

            color: var(--muted);
        }

        .switch {
            position: relative;

            flex: 0 0 auto;

            width: 52px;
            height: 30px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;

            border-radius: 999px;

            background: #ddd;

            transition: .2s;
        }

        .slider::before {
            content: "";

            position: absolute;

            width: 24px;
            height: 24px;

            top: 3px;
            left: 3px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 2px 6px rgba(0,0,0,.15);

            transition: .2s;
        }

        .switch input:checked + .slider {
            background: var(--pink);
        }

        .switch input:checked + .slider::before {
            transform: translateX(22px);
        }

        /* =========================
           提交
        ========================= */

        .submit-btn {
            width: 100%;

            min-height: 52px;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #ff77a6,
                    #ff6097
                );

            color: white;

            font-size: 16px;
            font-weight: 800;

            box-shadow:
                0 8px 18px
                rgba(255,96,151,.20);
        }

        .submit-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            box-shadow: none;
        }

        .tip {
            margin-top: 10px;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.6;

            text-align: center;
        }

        /* =========================
           状态
        ========================= */

        .state-box {
            padding: 50px 20px;

            text-align: center;
        }

        .state-icon {
            margin-bottom: 14px;

            font-size: 46px;
        }

        .state-title {
            margin-bottom: 8px;

            font-size: 18px;
            font-weight: 800;
        }

        .state-desc {
            margin-bottom: 20px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.7;
        }

        .state-btn {
            min-width: 150px;
            min-height: 46px;

            padding: 0 20px;

            border: none;

            border-radius: 14px;

            background: var(--pink);

            color: white;

            font-weight: 800;
        }

        /* =========================
           Toast
        ========================= */

        .toast {
            position: fixed;

            left: 50%;

            bottom:
                calc(34px + env(safe-area-inset-bottom));

            z-index: 100;

            max-width:
                calc(100% - 40px);

            padding: 12px 18px;

            border-radius: 12px;

            background:
                rgba(55,42,47,.94);

            color: white;

            font-size: 14px;
            line-height: 1.5;

            text-align: center;

            transform:
                translateX(-50%)
                translateY(15px);

            opacity: 0;

            pointer-events: none;

            transition: .2s;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 380px) {

            .star {
                width: 44px;
                height: 44px;

                font-size: 34px;
            }
        }

        @media (min-width: 600px) {

            body {
                background: #f6f0f3;
            }

            .app {
                box-shadow:
                    0 0 35px
                    rgba(80,45,60,.08);
            }
        }
    </style>
<style>
/* 荷序健康：米白底与深青绿主色，保留粉色点缀、评分星星和图标原色。 */
:root{--text:#233633;--muted:#68766e;--border:#d3dcd4;--shadow:0 5px 20px rgba(16,53,55,.05)}
html,body,.app{background:#f4f0e6}
.header{background:#0b5051;border-color:#386e63}
.title{color:#fffcf7;font-family:"Songti SC","STSong",serif;font-weight:500;letter-spacing:1px}
.back-btn{color:#fffcf7}
.card{background:#fffcf7;border-radius:4px}
.card-title,.rating-title,.field-label,.anonymous-title,.state-title{color:#103537}
.info-row{border-color:#dce3da}
.order-number{background:#fff0f5;color:#b63c69;border-radius:4px}
.amount,.rating-text{color:#c34472}
.tag{background:#fffcf7;color:#52695e;border-radius:4px}
.tag.active{background:#fff0f5;border-color:#e5a9bd;color:#b63c69}
textarea{background:#fff;border-radius:4px}
textarea:focus{border-color:#478c80;box-shadow:0 0 0 3px rgba(11,80,81,.09)}
.switch input:checked + .slider{background:#0b5051}
.submit-btn,.state-btn{background:#0b5051;color:#fff;border-radius:4px;box-shadow:0 5px 16px rgba(16,53,55,.1)}
.submit-btn:disabled{box-shadow:none}
.toast{background:rgba(16,53,55,.96);border-radius:4px}
button:focus-visible{outline:2px solid #478c80;outline-offset:3px}
@media(min-width:600px){body{background:#f4f0e6}.app{box-shadow:0 0 35px rgba(16,53,55,.07)}}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="header-side">

            <button
                class="back-btn"
                type="button"
                onclick="goBack()"
            >
                ← 返回
            </button>

        </div>

        <div class="title">
            服务评价
        </div>

        <div class="header-side right"></div>

    </header>


    <!-- 加载 -->

    <main
        id="loadingState"
        class="state-box"
    >

        <div class="state-icon">
            🌷
        </div>

        <div class="state-title">
            正在读取订单
        </div>

        <div class="state-desc">
            请稍候……
        </div>

    </main>


    <!-- 错误 -->

    <main
        id="errorState"
        class="state-box hidden"
    >

        <div class="state-icon">
            🌸
        </div>

        <div
            id="errorTitle"
            class="state-title"
        >
            暂时无法评价
        </div>

        <div
            id="errorDesc"
            class="state-desc"
        ></div>

        <button
            class="state-btn"
            type="button"
            onclick="goCustomerHome()"
        >
            返回客户中心
        </button>

    </main>


    <!-- 已评价 -->

    <main
        id="completedState"
        class="state-box hidden"
    >

        <div class="state-icon">
            💗
        </div>

        <div class="state-title">
            这笔订单已经评价
        </div>

        <div class="state-desc">
            感谢您的评价与支持。
        </div>

        <button
            class="state-btn"
            type="button"
            onclick="goCustomerHome()"
        >
            返回客户中心
        </button>

    </main>


    <!-- 评价主体 -->

    <main
        id="reviewPage"
        class="content hidden"
    >

        <!-- 订单 -->

        <section class="card">

            <div class="card-title">
                本次服务
            </div>

            <div
                id="orderNo"
                class="order-number"
            >
                订单
            </div>

            <div class="info-row">

                <div class="info-label">
                    服务商户
                </div>

                <div
                    id="merchantName"
                    class="info-value"
                >
                    -
                </div>

            </div>

            <div class="info-row">

                <div class="info-label">
                    服务项目
                </div>

                <div
                    id="productName"
                    class="info-value"
                >
                    -
                </div>

            </div>

            <div class="info-row">

                <div class="info-label">
                    实付金额
                </div>

                <div
                    id="payableAmount"
                    class="info-value amount"
                >
                    ¥0.00
                </div>

            </div>

        </section>


        <!-- 星级 -->

        <section class="card">

            <div class="rating-section">

                <div class="rating-title">
                    您对本次服务满意吗？
                </div>

                <div class="rating-subtitle">
                    点击星星进行评分
                </div>

                <div class="stars">

                    <button
                        class="star"
                        data-value="1"
                        type="button"
                        onclick="setRating(1)"
                    >
                        ★
                    </button>

                    <button
                        class="star"
                        data-value="2"
                        type="button"
                        onclick="setRating(2)"
                    >
                        ★
                    </button>

                    <button
                        class="star"
                        data-value="3"
                        type="button"
                        onclick="setRating(3)"
                    >
                        ★
                    </button>

                    <button
                        class="star"
                        data-value="4"
                        type="button"
                        onclick="setRating(4)"
                    >
                        ★
                    </button>

                    <button
                        class="star"
                        data-value="5"
                        type="button"
                        onclick="setRating(5)"
                    >
                        ★
                    </button>

                </div>

                <div
                    id="ratingText"
                    class="rating-text"
                >
                    请选择评分
                </div>

            </div>

        </section>


        <!-- 标签 -->

        <section class="card">

            <label class="field-label">
                服务印象
            </label>

            <div class="tags">

                <button
                    class="tag"
                    type="button"
                    data-tag="服务专业"
                    onclick="toggleTag(this)"
                >
                    服务专业
                </button>

                <button
                    class="tag"
                    type="button"
                    data-tag="态度很好"
                    onclick="toggleTag(this)"
                >
                    态度很好
                </button>

                <button
                    class="tag"
                    type="button"
                    data-tag="耐心细致"
                    onclick="toggleTag(this)"
                >
                    耐心细致
                </button>

                <button
                    class="tag"
                    type="button"
                    data-tag="环境整洁"
                    onclick="toggleTag(this)"
                >
                    环境整洁
                </button>

                <button
                    class="tag"
                    type="button"
                    data-tag="准时守约"
                    onclick="toggleTag(this)"
                >
                    准时守约
                </button>

                <button
                    class="tag"
                    type="button"
                    data-tag="值得推荐"
                    onclick="toggleTag(this)"
                >
                    值得推荐
                </button>

            </div>

        </section>


        <!-- 内容 -->

        <section class="card">

            <label
                for="reviewContent"
                class="field-label"
            >
                写下您的评价
            </label>

            <div class="textarea-wrap">

                <textarea
                    id="reviewContent"
                    maxlength="500"
                    placeholder="可以说说服务体验、专业程度、服务态度等……"
                    oninput="updateCounter()"
                ></textarea>

                <div
                    id="counter"
                    class="counter"
                >
                    0 / 500
                </div>

            </div>

        </section>


        <!-- 匿名 -->

        <section class="card">

            <div class="anonymous-row">

                <div>

                    <div class="anonymous-title">
                        匿名评价
                    </div>

                    <div class="anonymous-desc">
                        开启后，对外展示评价时不显示您的客户身份。
                    </div>

                </div>

                <label class="switch">

                    <input
                        id="anonymousSwitch"
                        type="checkbox"
                        checked
                    >

                    <span class="slider"></span>

                </label>

            </div>

        </section>


        <!-- 提交 -->

        <button
            id="submitBtn"
            class="submit-btn"
            type="button"
            onclick="submitReview()"
        >
            提交评价
        </button>

        <div class="tip">
            每笔订单只能提交一次评价，请确认后提交。
        </div>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>
const CUSTOMER_SESSION_KEY="hexu_customer_session_v1";
let apiSession=loadApiSession(),currentUser=null,currentCustomer=null,currentOrder=null,currentOrderItem=null,rating=0,selectedTags=[],submitting=false,idleTimer=null,toastTimer=null;
const IDLE_LIMIT=10*60*1000;

function loadApiSession(){try{return JSON.parse(localStorage.getItem(CUSTOMER_SESSION_KEY)||"null")}catch{return null}}
function saveApiSession(v){apiSession=v||null;if(apiSession)localStorage.setItem(CUSTOMER_SESSION_KEY,JSON.stringify(apiSession));else localStorage.removeItem(CUSTOMER_SESSION_KEY)}
function accessToken(){return apiSession?.access_token||""}
async function api(path,{method="GET",body,auth=true}={}){
 const headers={Accept:"application/json"};if(body!==undefined)headers["Content-Type"]="application/json";
 if(auth){const token=accessToken();if(!token)throw new Error("请先登录");headers.Authorization="Bearer "+token}
 let response;try{response=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"})}catch{throw new Error("网络连接失败，请稍后重试")}
 const raw=await response.text();let data=null;try{data=raw?JSON.parse(raw):null}catch{data=raw}
 if(!response.ok){const message=data?.message||data?.msg||data?.error_description||data?.error||"请求失败";throw new Error(typeof message==="string"?message:"请求失败")}
 return data
}
async function refreshApiSession(){if(!apiSession?.refresh_token)return false;try{const data=await api("/api/auth/refresh",{method:"POST",auth:false,body:{refresh_token:apiSession.refresh_token}});if(!data?.access_token)return false;saveApiSession({...apiSession,...data});return true}catch{return false}}
async function apiAuth(path,options={}){try{return await api(path,{...options,auth:true})}catch(error){if(/jwt|token|登录状态|unauthorized|401/i.test(String(error?.message||""))&&await refreshApiSession())return api(path,{...options,auth:true});throw error}}

document.addEventListener("DOMContentLoaded",initPage);
async function initPage(){
 try{
  setupIdleLogout();showLoading();
  if(!apiSession?.access_token&&!(await refreshApiSession())){goLogin();return}
  const profileRows=await apiAuth("/api/customer/profile"),profile=Array.isArray(profileRows)?profileRows[0]:profileRows;
  if(!profile||(profile.status&&profile.status!=="active")||(profile.role!=="customer"&&profile.user_type!=="customer")){saveApiSession(null);goLogin();return}
  currentUser={id:profile.id,phone:apiSession?.user?.phone||""};
  const customerRows=await apiAuth("/api/customer/record"),customer=Array.isArray(customerRows)?customerRows[0]:customerRows;
  if(!customer){showError("无法识别客户账户","当前登录账户没有找到对应的客户资料，请重新登录。");return}
  if(customer.status&&customer.status!=="active"){showError("客户账户不可用","当前客户账户已经不是有效状态。");return}
  currentCustomer=customer;
  const params=new URLSearchParams(window.location.search),rawOrderId=params.get("order")||params.get("order_id")||params.get("id"),orderId=Number(rawOrderId);
  if(!Number.isInteger(orderId)||orderId<=0){showError("没有找到订单","当前页面缺少有效的订单编号。");return}
  const data=await apiAuth("/api/customer/review-context?order_id="+encodeURIComponent(orderId));
  if(data?.already_reviewed){showCompleted();return}
  if(!data?.order){showError("没有找到订单","该订单不存在，或者不属于当前登录客户。");return}
  currentOrder=data.order;currentOrderItem=data.item||null;
  if(!isOrderCompleted(currentOrder)){showError("订单暂时不能评价","服务全部完成后才可以提交评价。");return}
  renderOrder();showReviewPage();
 }catch(error){console.error("评价页面初始化异常：",error);if(/请先登录|登录状态|jwt|token|unauthorized|401/i.test(String(error?.message||""))){saveApiSession(null);goLogin();return}showError("页面加载失败",error?.message||"请稍后重新尝试。")}
}
function isOrderCompleted(order){return!!order&&(order.order_status==="completed"||!!order.completed_at)}
function renderOrder(){setText("orderNo","订单号："+(currentOrder.order_no||("#"+currentOrder.id)));setText("merchantName",currentOrder.merchant_name_snapshot||"服务商户");setText("productName",currentOrderItem?.product_name_snapshot||"服务项目");setText("payableAmount",money(Number(currentOrder.payable_amount??currentOrder.total_amount??0)))}
function setRating(value){rating=Number(value);document.querySelectorAll(".star").forEach(star=>star.classList.toggle("active",Number(star.dataset.value)<=rating));setText("ratingText",({1:"非常不满意",2:"不太满意",3:"基本满意",4:"很满意",5:"非常满意"})[rating]||"请选择评分")}
function toggleTag(button){const tag=button.dataset.tag;if(!tag)return;if(selectedTags.includes(tag)){selectedTags=selectedTags.filter(item=>item!==tag);button.classList.remove("active")}else{selectedTags.push(tag);button.classList.add("active")}}
function updateCounter(){const value=document.getElementById("reviewContent").value;setText("counter",`${value.length} / 500`)}
async function submitReview(){
 if(submitting)return;
 if(!currentOrder||!currentUser){toast("订单信息尚未准备完成");return}
 if(rating<1||rating>5){toast("请先选择1～5星评分");return}
 const content=document.getElementById("reviewContent").value.trim(),isAnonymous=document.getElementById("anonymousSwitch").checked;
 submitting=true;setSubmitState(true);
 try{
  const data=await apiAuth("/api/customer/reviews",{method:"POST",body:{order_id:Number(currentOrder.id),rating,content:content||null,tags:selectedTags.length?selectedTags:null,is_anonymous:isAnonymous}});
  if(!data||data.success!==true)throw new Error(data?.message||data?.error||"评价提交失败");
  toast("评价提交成功，谢谢您的支持 🌷");setTimeout(()=>{window.location.href="./customer.html"},900);
 }catch(error){
  console.error("提交评价失败：",error);const message=cleanErrorMessage(error?.message||"评价提交失败，请重新尝试");
  if(message.includes("已经评价")){showCompleted();return}toast(message);
 }finally{submitting=false;setSubmitState(false)}
}
function setSubmitState(loading){const button=document.getElementById("submitBtn");button.disabled=loading;button.textContent=loading?"正在提交评价...":"提交评价"}
function hideAllStates(){["loadingState","errorState","completedState","reviewPage"].forEach(id=>document.getElementById(id).classList.add("hidden"))}
function showLoading(){hideAllStates();document.getElementById("loadingState").classList.remove("hidden")}
function showReviewPage(){hideAllStates();document.getElementById("reviewPage").classList.remove("hidden")}
function showCompleted(){hideAllStates();document.getElementById("completedState").classList.remove("hidden")}
function showError(title,description){hideAllStates();setText("errorTitle",title||"暂时无法评价");setText("errorDesc",description||"请稍后重新尝试。");document.getElementById("errorState").classList.remove("hidden")}
function setupIdleLogout(){["touchstart","touchmove","click","keydown","scroll"].forEach(eventName=>document.addEventListener(eventName,resetIdleTimer,{passive:true}));resetIdleTimer()}
function resetIdleTimer(){if(idleTimer)clearTimeout(idleTimer);idleTimer=setTimeout(logoutByIdle,IDLE_LIMIT)}
async function logoutByIdle(){saveApiSession(null);window.location.href="./login.html?reason=idle"}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2800)}
function setText(id,value){const el=document.getElementById(id);if(!el)return;el.textContent=(value===null||value===undefined||value==="")?"-":String(value)}
function money(value){const number=Number(value||0);return Number.isFinite(number)?"¥"+number.toFixed(2):"¥0.00"}
function cleanErrorMessage(message){return String(message||"操作失败").split("\n")[0]}
function goBack(){if(document.referrer&&document.referrer.includes(window.location.hostname))history.back();else goCustomerHome()}
function goCustomerHome(){window.location.href="./customer.html"}
function goLogin(){window.location.replace("./login.html")}
</script>

</body>
