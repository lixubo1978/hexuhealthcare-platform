db.from("provinces").select("id,province_code,province_name,status").eq("status","active").order("province_code"),
readCityPrices()
]);for(const [r,n] of [[a,"商户"],[b,"服务项目"],[c,"服务项目类型"],[d,"分账规则"],[e,"已开通服务城市"],[f,"城市"],[g,"省份"],[h,"城市标准价"]])if(r.error)throw new Error(n+"读取失败："+r.error.message);merchants=a.data||[];products=b.data||[];categories=c.data||[];rules=d.data||[];serviceAreas=e.data||[];cities=f.data||[];provinces=g.data||[];cityPrices=h.data||[];renderCity();renderMerchantFilter();renderCategoryFilters();renderAll()}
function openedCities(){const m=new Map;serviceAreas.forEach(a=>{if(a.city_id&&!m.has(String(a.city_id)))m.set(String(a.city_id),a)});return [...m.values()]}
function renderCity(){const s=$("cityFilter"),old=s.value,list=openedCities();s.innerHTML='<option value="">全部已开通服务城市</option>'+list.map(a=>{const c=cityById(a.city_id),p=provinceById(a.province_id||c?.province_id),no=a.area_no?String(a.area_no).padStart(3,"0"):"";return `<option value="${esc(a.city_id)}">${no?esc(no)+" | ":""}${p?.province_name?esc(p.province_name)+" · ":""}${esc(c?.city_name||"城市 "+a.city_id)}</option>`}).join("");if(old&&list.some(a=>String(a.city_id)===String(old)))s.value=old}
function cityMerchants(){const c=$("cityFilter").value;return c?merchants.filter(m=>String(merchantCityId(m))===String(c)):merchants}
function renderMerchantFilter(){const s=$("merchantFilter"),old=s.value,list=cityMerchants();s.innerHTML='<option value="">全部商户</option>'+list.map(m=>`<option value="${esc(m.id)}">${merchantCode(m)?esc(merchantCode(m))+" | ":""}${esc(merchantName(m))}</option>`).join("");s.value=old&&list.some(m=>String(m.id)===String(old))?old:""}
function renderCategoryFilters(){const s=$("topCategoryFilter"),old=s.value,list=categories.filter(c=>c.parent_category_id==null);s.innerHTML='<option value="">全部第一大类</option>'+list.map(c=>`<option value="${esc(c.id)}">${esc(c.category_name)}${c.status==="inactive"?"（已失效）":""}</option>`).join("");s.value=old&&list.some(c=>String(c.id)===old)?old:"";renderSecondCategoryFilter()}
function renderSecondCategoryFilter(){const s=$("categoryFilter"),old=s.value,parentId=$("topCategoryFilter").value,list=categories.filter(c=>c.parent_category_id!=null&&(!parentId||String(c.parent_category_id)===parentId));s.innerHTML=`<option value="">${parentId&&!list.length?"暂无第二大类":"全部第二大类"}</option>`+list.map(c=>`<option value="${esc(c.id)}">${esc(c.category_name)}${c.status==="inactive"?"（已失效）":""}</option>`).join("");s.value=old&&list.some(c=>String(c.id)===old)?old:"";s.disabled=!list.length}
function categoryProducts(){const parentId=$("topCategoryFilter").value,childId=$("categoryFilter").value,childIds=parentId?new Set(categories.filter(c=>String(c.parent_category_id??"")===parentId).map(c=>String(c.id))):null;return products.filter(p=>(!childIds||childIds.has(String(p.category_id)))&&(!childId||String(p.category_id)===childId))}
function renderAll(){renderStats();renderList()}
function renderStats(){const ms=cityMerchants(),total=ms.length*products.length;let n=0;ms.forEach(m=>products.forEach(p=>{if(activeRule(m.id,p.id))n++}));$("statMerchants").textContent=ms.length;$("statProducts").textContent=products.length;$("statRules").textContent=n;$("statUndefined").textContent=Math.max(0,total-n)}
function filteredMerchants(){const id=$("merchantFilter").value,list=cityMerchants();return id?list.filter(m=>String(m.id)===String(id)):list}
function filteredProducts(m){const k=$("searchInput").value.trim().toLowerCase(),list=categoryProducts();if(!k)return list;if((merchantName(m)+" "+merchantCode(m)).toLowerCase().includes(k))return list;return list.filter(p=>(productName(p)+" "+productCode(p)+" "+productCategory(p)).toLowerCase().includes(k))}
function renderList(){
const box=$("merchantContainer"),blocks=[];
filteredMerchants().forEach(m=>{
const ps=filteredProducts(m);if(!ps.length)return;
const count=ps.filter(p=>activeRule(m.id,p.id)).length;
const showHistory=$("showHistory").checked,rows=ps.map(p=>{const r=activeRule(m.id,p.id),current=`<tr class="${r?"rule-active-row":""}"><td><div class="product-name">${esc(productName(p))}</div><div class="product-code">${esc(productCode(p)||"—")}</div></td><td><span class="category-badge">${esc(productCategory(p))}</span></td><td><span class="badge ${r?"badge-green":"badge-orange"}">${r?"已定义并生效":"未定义"}</span></td><td>${r?ratioHtml(r):"—"}</td><td>${r?`<div class="action-line"><button class="btn btn-small btn-disabled" disabled>已锁定</button><button class="btn btn-small btn-danger invalidate-btn" data-rule-id="${esc(r.id)}" data-merchant-index="${merchants.indexOf(m)}" data-product-id="${esc(p.id)}">设为无效</button></div>`:`<button class="btn btn-primary btn-small set-rule-btn" data-merchant-index="${merchants.indexOf(m)}" data-product-id="${esc(p.id)}">设置分账</button>`}</td><td>—</td><td>—</td><td>${cityPriceHtml(m,p)}</td></tr>`,history=showHistory?historyRules(m.id,p.id).map(h=>`<tr class="rule-history-row"><td><div class="product-name">${esc(productName(p))} <span class="product-code">· V${esc(h.version_no||1)}</span></div><div class="product-code">${esc(productCode(p)||"—")}</div></td><td><span class="category-badge">${esc(productCategory(p))}</span></td><td><span class="badge badge-gray">历史失效</span></td><td>${ratioHtml(h)}</td><td>—</td><td>${esc(invalidator(h))}</td><td>${esc(fmt(h.invalidated_at))}</td><td>${cityPriceHtml(m,p)}</td></tr>`).join(""):"";return current+history}).join("");
const mobile=ps.map(p=>{const r=activeRule(m.id,p.id),current=`<div class="mobile-card ${r?"locked":""}"><div class="mobile-card-top"><div><div class="product-name">${esc(productName(p))}</div><div class="product-code">${esc(productCode(p)||"—")}</div></div><span class="badge ${r?"badge-green":"badge-orange"}">${r?"已定义":"未定义"}</span></div><div class="mobile-meta">服务项目类型：<span class="category-badge">${esc(productCategory(p))}</span></div>${r?`${ratioHtml(r)}<div class="action-line" style="margin-top:12px"><button class="btn btn-small btn-disabled" disabled>已锁定</button><button class="btn btn-small btn-danger invalidate-btn" data-rule-id="${esc(r.id)}" data-merchant-index="${merchants.indexOf(m)}" data-product-id="${esc(p.id)}">设为无效</button></div>`:`<button class="btn btn-primary btn-small set-rule-btn" data-merchant-index="${merchants.indexOf(m)}" data-product-id="${esc(p.id)}">设置分账</button>`}<div class="mobile-city-price"><span>当前城市标准价</span>${cityPriceHtml(m,p)}</div></div>`,history=showHistory?historyRules(m.id,p.id).map(h=>`<div class="mobile-card"><div class="mobile-card-top"><div><div class="product-name">${esc(productName(p))} · V${esc(h.version_no||1)}</div><div class="product-code">${esc(productCode(p)||"—")}</div></div><span class="badge badge-gray">历史失效</span></div><div class="mobile-meta">${ratioHtml(h)}<br>失效操作人：${esc(invalidator(h))}<br>失效时间：${esc(fmt(h.invalidated_at))}</div></div>`).join(""):"";return current+history}).join("");
blocks.push(`<section class="merchant-section"><div class="merchant-head"><div><div class="merchant-name">${esc(merchantName(m))}</div><div class="merchant-meta">${merchantCode(m)?"商户编号："+esc(merchantCode(m))+" · ":""}共 ${ps.length} 个服务项目 · ${count} 个已定义分账规则</div></div><div class="merchant-count">${count} / ${ps.length} 已定义</div></div><div class="desktop-table table-wrap"><table><thead><tr><th>服务项目</th><th>服务项目类型</th><th>分账状态</th><th>当前分账比例</th><th>操作</th><th>失效操作人</th><th>失效时间</th><th class="city-price-heading">当前城市标准价</th></tr></thead><tbody>${rows}</tbody></table></div><div class="mobile-list">${mobile}</div></section>`)
});
box.innerHTML=blocks.join("");$("emptyBox").style.display=blocks.length?"none":"block"
}
function openRuleByIndex(merchantIndex,productId){
const index=Number(merchantIndex),m=merchants[index],p=products.find(x=>String(x.id)===String(productId));
if(!m||!p){toast("无法读取商户或服务项目信息。","error");return}
const realMerchantId=String(m.id||"").trim();
if(!isUUID(realMerchantId)){console.error("商户UUID异常",m);toast("商户ID异常，禁止设置分账规则。","error");return}
if(activeRule(realMerchantId,p.id)){toast("该商户与服务项目已经存在有效分账规则。","error");return}
editingMerchantId=realMerchantId;
editingProductId=String(p.id);
$("ruleTarget").innerHTML=`商户：<b>${esc(merchantName(m))}</b><br>服务项目类型：<b>${esc(productCategory(p))}</b><br>服务项目：<b>${esc(productName(p))}</b>${productCode(p)?`（${esc(productCode(p))}）`:""}`;
["platformRatio","cityManagerRatio","storeRatio","operatorRatio","advisorRatio"].forEach(id=>$(id).value="0");
calcTotal();$("ruleModal").classList.add("show")
}
function closeModal(){if(saving)return;$("ruleModal").classList.remove("show");editingMerchantId=null;editingProductId=null}
function ratios(){return{platform:Number($("platformRatio").value),city:Number($("cityManagerRatio").value),store:Number($("storeRatio").value),operator:Number($("operatorRatio").value),advisor:Number($("advisorRatio").value)}}
function calcTotal(){const r=ratios(),v=Object.values(r),valid=v.every(n=>Number.isFinite(n)&&n>=0&&n<=100),total=valid?v.reduce((a,b)=>a+b,0)+2:NaN;$("ratioTotal").textContent=Number.isFinite(total)?rv(total)+"%":"无效";$("totalBox").classList.toggle("bad",!Number.isFinite(total)||Math.abs(total-100)>.000001);return{r,total,valid}}
async function saveRule(){
if(saving)return;
if(!editingMerchantId||!isUUID(editingMerchantId)){console.error("保存被阻止，editingMerchantId异常：",editingMerchantId);return toast("商户ID异常，禁止保存分账规则。请关闭窗口后重新点击设置分账。","error")}
if(editingProductId===null||editingProductId===""||!Number.isFinite(Number(editingProductId)))return toast("服务项目ID异常，禁止保存分账规则。","error");
const merchant=merchants.find(m=>String(m.id).trim()===editingMerchantId);
const product=products.find(p=>String(p.id)===String(editingProductId));
if(!merchant||!isUUID(String(merchant.id).trim()))return toast("当前商户UUID校验失败，禁止保存。","error");
if(!product)return toast("当前服务项目不存在，禁止保存。","error");
const merchantId=String(merchant.id).trim(),productId=Number(product.id);
const {r,total,valid}=calcTotal();
if(!valid)return toast("所有分账比例必须在0%至100%之间。","error");
if(Math.abs(total-100)>.000001)return toast("六方分账比例合计必须等于100%。","error");
if(activeRule(merchantId,productId))return toast("该商户与服务项目已经存在有效分账规则，请刷新页面。","error");
if(!confirm(`确认保存这条分账规则？\n\n商户：${merchantName(merchant)}\n服务项目：${productName(product)}\n\n保存后将立即生效并锁定。`))return;
saving=true;$("saveRuleBtn").disabled=true;
try{
const payload={
p_merchant_id:merchantId,
p_product_id:productId,
p_city_manager_ratio:r.city,
p_platform_ratio:r.platform,
p_store_ratio:r.store,
p_operator_ratio:r.operator,
p_order_source_ratio:r.advisor
};
console.log("create_merchant_product_rule payload:",payload);
const {data,error}=await db.rpc("create_merchant_product_rule",payload);
if(error)throw error;
if(!data?.success)throw new Error(data?.error||"保存失败");
$("ruleModal").classList.remove("show");editingMerchantId=null;editingProductId=null;
await reloadRules();
toast(`分账规则保存成功，版本 V${data.version_no||1}`)
}catch(e){console.error(e);toast("保存失败："+(e.message||"未知错误"),"error")}
finally{saving=false;$("saveRuleBtn").disabled=false}
}
async function invalidateRule(ruleId,merchantIndex,productId){
const m=merchants[Number(merchantIndex)],p=products.find(x=>String(x.id)===String(productId));
if(!m||!p)return toast("无法读取商户或服务项目信息。","error");
if(!confirm(`确认将这条分账规则设为无效？\n\n商户：${merchantName(m)}\n服务项目：${productName(p)}\n\n旧规则将作为历史记录保留，当前项目恢复为“未定义”。`))return;
loading("正在将分账规则设为无效...");
try{
const {data,error}=await db.rpc("invalidate_merchant_product_rule",{p_rule_id:Number(ruleId)});
if(error)throw error;
if(!data?.success)throw new Error(data?.error||"设置无效失败");
await reloadRules();toast("已设为无效，原规则已保留为历史记录。")
}catch(e){console.error(e);toast("设置无效失败："+(e.message||"未知错误"),"error")}
finally{loading()}
}
async function reloadRules(){const {data,error}=await db.from("merchant_product_rules").select("*").in("status",["active","inactive"]).order("created_at",{ascending:false});if(error)throw error;rules=data||[];renderAll()}
$("merchantContainer").addEventListener("click",e=>{
const set=e.target.closest(".set-rule-btn");
if(set){openRuleByIndex(set.dataset.merchantIndex,set.dataset.productId);return}
const inv=e.target.closest(".invalidate-btn");
if(inv)invalidateRule(inv.dataset.ruleId,inv.dataset.merchantIndex,inv.dataset.productId)
});
$("cityFilter").addEventListener("change",()=>{$("merchantFilter").value="";renderMerchantFilter();renderAll()});
$("merchantFilter").addEventListener("change",renderList);
$("topCategoryFilter").addEventListener("change",()=>{$("categoryFilter").value="";renderSecondCategoryFilter();renderList()});
$("categoryFilter").addEventListener("change",renderList);
$("searchInput").addEventListener("input",renderList);
$("showHistory").addEventListener("change",renderList);
["platformRatio","cityManagerRatio","storeRatio","operatorRatio","advisorRatio"].forEach(id=>$(id).addEventListener("input",calcTotal));
$("ruleModal").addEventListener("click",e=>{if(e.target===$("ruleModal"))closeModal()});
$("modalCloseBtn").addEventListener("click",closeModal);
$("cancelRuleBtn").addEventListener("click",closeModal);
$("saveRuleBtn").addEventListener("click",saveRule);
$("backBtn").addEventListener("click",()=>location.href=HOME_PAGE);
$("logoutBtn").addEventListener("click",async()=>{try{await db.auth.signOut()}finally{location.href=LOGIN_PAGE}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("ruleModal").classList.contains("show"))closeModal()});
init();
</script>
