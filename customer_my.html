<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>荷序健康 - 我的</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--g:#0b5051;--deep:#103537;--cream:#f4f0e6;--paper:#fffcf7;--soft:#e8efe8;--line:#d3dcd4;--muted:#64716a}html,body{margin:0;min-height:100%;background:var(--cream);color:#233633;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer}.app{width:100%;max-width:560px;min-height:100vh;margin:auto;background:var(--cream);padding-top:env(safe-area-inset-top)}.top{min-height:86px;padding:17px 20px;background:var(--g);border:0;display:flex;align-items:center;justify-content:space-between;color:#fffcf7}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;object-fit:contain;background:#fffcf7;border-radius:7px;padding:3px}.brand b{display:block;font-size:21px;color:#fffcf7;letter-spacing:.6px}.brand small{display:block;margin-top:3px;color:#d0e0d8;font-size:10px}.green{border:1px solid #afc3b9;background:#fffcf7;color:var(--g);padding:8px 11px;border-radius:4px;font-weight:700}.hero{margin:10px 14px;padding:13px 14px;background:var(--soft);color:#233633;border:1px solid var(--line);border-radius:6px}.hero small{color:var(--muted);font-size:10px}.hero h1{margin:3px 0 4px;font-size:18px;line-height:1.45;color:var(--deep)}.tag{display:inline-block;border:1px solid #afc3b9;background:var(--paper);color:#52695e;padding:4px 7px;margin:4px 4px 0 0;border-radius:4px;font-size:10px}.work{margin:12px 14px 0;display:grid;grid-template-columns:104px minmax(0,1fr);min-height:max(540px,calc(100svh - 280px));border:1px solid var(--line);border-radius:7px;background:var(--paper);overflow:hidden}.tabs{background:#edf1e8;border-right:1px solid var(--line);padding:8px 6px}.tab{width:100%;min-height:50px;margin-bottom:5px;border:0;border-radius:4px;background:transparent;text-align:left;padding:9px 7px;color:#52695e;font-size:12px;font-weight:700;line-height:1.4}.tab.on{background:var(--g);color:#fff}.content{padding:13px 10px;min-width:0}.panel{display:none}.panel.on{display:block}.head{padding:0 2px 11px;border-bottom:1px solid var(--line)}.title{font-size:18px;line-height:1.4;font-weight:800;color:var(--deep)}.desc{margin-top:4px;font-size:10px;line-height:1.5;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border:0;margin-top:12px}.sum{text-align:center;padding:11px 3px;border:1px solid var(--line);border-radius:5px;background:#f7f8f3}.sum:last-child{border:1px solid var(--line)}.sum b{display:block;font-size:20px;color:var(--g)}.sum small{display:block;margin-top:5px;color:var(--muted);font-size:9px}.list{display:flex;flex-direction:column;gap:9px;margin-top:12px}.card{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:12px}.toprow,.row{display:flex;justify-content:space-between;gap:10px}.toprow b{color:var(--deep);font-size:13px}.sub{font-size:9px;color:#748078;margin-top:3px}.badge{background:var(--soft);color:var(--g);padding:4px 7px;border-radius:3px;font-size:9px}.row{font-size:11px;margin-top:7px}.row span:first-child{color:var(--muted)}.row span:last-child{text-align:right;font-weight:600}.btn{margin-top:10px;width:100%;min-height:38px;border:1px solid #afc3b9;border-radius:4px;background:#e4eee6;color:var(--g);padding:8px 10px;font-weight:700}.empty{border:1px solid var(--line);border-radius:6px;background:#f7f8f3;margin-top:12px;padding:25px 10px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}.empty b{display:block;color:var(--deep);font-size:16px}.note{margin-top:12px;padding:10px;background:var(--soft);border:1px solid #c7d7ca;border-radius:5px;color:#52695e;font-size:10px;line-height:1.65}.grid{display:grid;grid-template-columns:1fr;gap:0}.field{margin-top:10px}.field label{display:block;font-size:10px;color:#52695e;font-weight:700;margin-bottom:5px}.input{width:100%;min-height:42px;border:1px solid #c4d2c7;border-radius:4px;background:var(--paper);padding:8px 10px;outline:0}.input:focus{border-color:#478c80;box-shadow:0 0 0 3px rgba(11,80,81,.08)}.input[readonly]{background:#edf1e9;color:#748078}#saveBtn{width:100%;min-height:43px;margin-top:13px;background:var(--g);color:#fff;border-color:var(--g)}#p-settings .list{gap:7px}#p-settings .green{width:100%;min-height:43px;text-align:left;background:var(--paper);border-color:var(--line);color:var(--g)}.bottom{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;min-height:68px;padding:6px 14px calc(6px + env(safe-area-inset-bottom));background:rgba(255,252,247,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}.nav{border:0;border-radius:4px;background:transparent;color:#64716a;font-size:10px;line-height:1.5}.nav.on{color:#fff;background:var(--g)}.loading{position:fixed;inset:0;z-index:99;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--g)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:calc(100vw - 36px);background:var(--deep);color:#fff;padding:10px 14px;border-radius:4px;display:none;z-index:100;font-size:11px}@media(min-width:760px){.app{max-width:920px}.work{grid-template-columns:160px minmax(0,1fr);margin-left:20px;margin-right:20px}.hero{margin-left:20px;margin-right:20px}.tabs{padding:10px}.tab{font-size:13px;padding:11px 12px}.content{padding:18px}.grid{grid-template-columns:1fr 1fr;gap:12px}.bottom{max-width:920px}.title{font-size:20px}}@media(max-width:360px){.work{grid-template-columns:88px minmax(0,1fr);margin-left:10px;margin-right:10px}.hero{margin-left:10px;margin-right:10px}.tabs{padding:6px 4px}.tab{font-size:11px;padding:8px 5px}.content{padding:11px 7px}}</style></head><body><div id="loading" class="loading">正在进入“我的”...</div><div class="app"><header class="top"><div class="brand"><img src="./logo.jpeg" class="logo"><div><b>荷序健康</b><small>我的 · 客户个人中心</small></div></div><button class="green" onclick="logout()">退出</button></header><section class="hero"><small>我的账户</small><h1 id="customerName">尊敬的客户</h1><span id="customerNo" class="tag">客户编号：--</span><span id="customerPhone" class="tag">手机号：--</span></section><main class="work"><aside class="tabs"><button class="tab on" data-tab="orders">我的订单</button><button class="tab" data-tab="referrals">推荐订单</button><button class="tab" data-tab="appointments">我的预约</button><button class="tab" data-tab="points">我的积分</button><button class="tab" data-tab="profile">个人资料</button><button class="tab" data-tab="reviews">评价/投诉</button><button class="tab" data-tab="common">常用信息</button><button class="tab" data-tab="settings">帮助/设置</button></aside><section class="content">
<div id="p-orders" class="panel on"><div class="head"><div class="title">我的订单</div><div class="desc">全部历史订单和当前服务状态</div></div><div id="summary" class="summary"></div><div id="orders" class="list"></div></div>
<div id="p-referrals" class="panel"><div class="head"><div class="title">推荐订单</div></div><div class="empty"><b>入口已预留</b>当前客户接口没有“本人推荐订单”专用数据，为避免越权读取其他客户订单，暂不显示假数据。</div></div>
<div id="p-appointments" class="panel"><div class="head"><div class="title">我的预约</div></div><div id="appointments" class="list"></div></div>
<div id="p-points" class="panel"><div class="head"><div class="title">我的积分</div></div><div class="empty"><b>入口已预留</b>当前正式客户接口没有积分数据，待积分规则和接口确定后接入。</div></div>
<div id="p-profile" class="panel"><div class="head"><div class="title">个人资料</div><div class="desc">仅修改当前登录客户本人资料</div></div><div class="note">沿用 customer.html 已验证的客户权限和资料接口；手机号由登录账户读取。</div><div class="grid"><div class="field"><label>客户姓名</label><input id="realName" class="input"></div><div class="field"><label>手机号</label><input id="phone" class="input" readonly></div><div class="field"><label>所在省</label><select id="province" class="input" onchange="provinceChanged()"></select></div><div class="field"><label>所在市</label><select id="city" class="input"></select></div></div><div class="field"><label>详细地址</label><input id="address" class="input"></div><div class="grid"><div class="field"><label>工作单位</label><input id="workUnit" class="input"></div><div class="field"><label>职业</label><input id="occupation" class="input"></div><div class="field"><label>紧急联系人</label><input id="emergencyName" class="input"></div><div class="field"><label>紧急联系人电话</label><input id="emergencyPhone" class="input"></div></div><button id="saveBtn" class="green" style="margin-top:14px" onclick="saveProfile()">保存个人资料</button></div>
<div id="p-reviews" class="panel"><div class="head"><div class="title">评价 / 投诉</div></div><div id="reviews" class="list"></div></div>
<div id="p-common" class="panel"><div class="head"><div class="title">常用信息</div></div><div class="empty"><b>第二阶段功能</b>常用地址、联系人等先保留入口。</div></div>
<div id="p-settings" class="panel"><div class="head"><div class="title">帮助 / 设置</div></div><div class="list"><button class="green" onclick="location.href='./index.html'">返回荷序健康主页</button><button class="green" onclick="toast('帮助与客服功能待接入')">帮助与客服</button><button class="green" onclick="toast('隐私与用户协议页面待接入')">隐私与用户协议</button><button class="green" onclick="logout()">退出当前账户</button></div></div>
</section></main></div><nav class="bottom"><button class="nav" onclick="location.href='./customer.html'">🏠<br>首页</button><button class="nav" onclick="location.href='./customer_orders.html'">🧾<br>订单</button><button class="nav on">👤<br>我的</button></nav><div id="toast" class="toast"></div><script>
const KEY="hexu_customer_session_v1";let S=load(),P=null,C=null,O=[];function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch{return null}}function save(v){S=v||null;S?localStorage.setItem(KEY,JSON.stringify(S)):localStorage.removeItem(KEY)}function token(){return S?.access_token||""}
async function api(path,{method="GET",body,auth=true}={}){let h={Accept:"application/json"};if(body!==undefined)h["Content-Type"]="application/json";if(auth){if(!token())throw Error("请先登录");h.Authorization="Bearer "+token()}let r;try{r=await fetch(path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"})}catch{throw Error("网络连接失败，请稍后重试")}let raw=await r.text(),d;try{d=raw?JSON.parse(raw):null}catch{d=raw}if(!r.ok)throw Error(d?.message||d?.msg||d?.error_description||d?.error||"请求失败");return d}
async function refresh(){if(!S?.refresh_token)return false;try{let d=await api("/api/auth/refresh",{method:"POST",auth:false,body:{refresh_token:S.refresh_token}});if(!d?.access_token)return false;save({...S,...d});return true}catch{return false}}async function auth(path,opt={}){try{return await api(path,{...opt,auth:true})}catch(e){if(/jwt|token|登录状态|unauthorized|401/i.test(String(e?.message||""))&&await refresh())return api(path,{...opt,auth:true});throw e}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById("p-"+b.dataset.tab).classList.add("on")});document.addEventListener("DOMContentLoaded",init);
async function init(){if(!S?.access_token)return login();try{let d=await auth("/api/customer/profile");P=Array.isArray(d)?d[0]:d;if(!P||P.status&&P.status!=="active"||!(P.role==="customer"||P.user_type==="customer"))return forceLogout();d=await auth("/api/customer/record");C=Array.isArray(d)?d[0]:d;if(!C)throw Error("没有找到客户资料");renderHeader();await Promise.all([loadOrders(),loadProfile()]);loading.style.display="none"}catch(e){loading.style.display="none";toast(e.message||"页面加载失败")}}
function renderHeader(){customerName.textContent=C.real_name||C.nickname||P.full_name||"尊敬的客户";customerNo.textContent="客户编号："+(C.customer_no??P.account_no??"--");customerPhone.textContent="手机号："+mask(S?.user?.phone||C.phone||"")}
async function loadOrders(){try{let d=await auth("/api/customer/orders");O=Array.isArray(d)?d:[]}catch{O=[]}renderOrders();renderAppointments();renderReviews()}function cancelled(o){return["cancelled","refunded"].includes(o.order_status)}function status(o){if(o.order_status==="cancelled")return"已取消";if(o.order_status==="refunded")return"已退款";if(o.order_status==="completed")return o.review_status==="completed"?"已完成":"待评价";if(o.order_status==="partially_used")return"消费中";return o.payment_status==="paid"?"待消费":"待付款"}
function card(o,extra=""){return `<div class="card"><div class="toprow"><div><b>${esc(o.merchant_name_snapshot||"服务商户")}</b><div class="sub">${date(o.created_at)}</div></div><span class="badge">${status(o)}</span></div><div class="row"><span>订单号</span><span>${esc(o.order_no||o.id)}</span></div>${extra}<button class="btn" onclick="detail('${safe(o.id)}')">查看订单</button></div>`}
function renderOrders(){let using=O.filter(o=>!cancelled(o)&&o.payment_status==="paid"&&Number(o.remaining_uses??0)>0&&o.order_status!=="completed").length,review=O.filter(o=>o.order_status==="completed"&&o.review_status!=="completed").length;summary.innerHTML=`<div class="sum"><b>${O.length}</b><small>全部订单</small></div><div class="sum"><b>${using}</b><small>服务中</small></div><div class="sum"><b>${review}</b><small>待评价</small></div>`;orders.innerHTML=O.slice(0,10).map(o=>card(o)).join("")||'<div class="empty"><b>暂无订单</b>您还没有历史订单。</div>'}
function appt(o){return o.appointment_at||o.appointment_time||o.scheduled_at||null}function renderAppointments(){let a=O.filter(o=>!cancelled(o)&&appt(o));appointments.innerHTML=a.map(o=>card(o,`<div class="row"><span>预约时间</span><span>${date(appt(o))}</span></div>`)).join("")||'<div class="empty"><b>暂无预约</b>当前订单中没有预约记录。</div>'}
function renderReviews(){let a=O.filter(o=>o.order_status==="completed"&&o.review_status!=="completed");reviews.innerHTML=a.map(o=>`<div class="card"><div class="toprow"><b>${esc(o.merchant_name_snapshot||"服务商户")}</b><span class="badge">待评价</span></div><button class="btn" onclick="location.href='./customer_review.html?order='+encodeURIComponent('${safe(o.id)}')">去评价</button></div>`).join("")||'<div class="empty"><b>暂无待评价订单</b>已完成且尚未评价的订单会显示在这里。</div>'}
async function loadProfile(){realName.value=C.real_name||C.nickname||P.full_name||"";phone.value=S?.user?.phone||C.phone||"";address.value=C.address||"";workUnit.value=C.work_unit||"";occupation.value=C.occupation||"";emergencyName.value=C.emergency_contact_name||"";emergencyPhone.value=C.emergency_contact_phone||"";let d=await auth("/api/customer/provinces");province.innerHTML='<option value="">请选择省份</option>'+((Array.isArray(d)?d:[]).map(x=>`<option value="${x.id}">${esc(x.province_name)}</option>`).join(""));if(C.province_id){province.value=String(C.province_id);await loadCities(C.province_id);city.value=String(C.city_id||"")}}
async function provinceChanged(){if(!province.value){city.innerHTML='<option value="">请先选择省份</option>';city.disabled=true;return}await loadCities(province.value)}async function loadCities(pid){city.disabled=true;let d=await auth("/api/customer/cities?province_id="+encodeURIComponent(pid));city.innerHTML='<option value="">请选择城市</option>'+((Array.isArray(d)?d:[]).map(x=>`<option value="${x.id}">${esc(x.city_name)}</option>`).join(""));city.disabled=false}
async function saveProfile(){let n=realName.value.trim(),pid=province.value,cid=city.value;if(!n)return toast("请填写客户姓名");if(!pid)return toast("请选择所在省份");if(!cid)return toast("请选择所在城市");saveBtn.disabled=true;try{let d=await auth("/api/customer/complete-profile",{method:"POST",body:{real_name:n,province_id:Number(pid),city_id:Number(cid),address:address.value.trim()||null,work_unit:workUnit.value.trim()||null,occupation:occupation.value.trim()||null,emergency_contact_name:emergencyName.value.trim()||null,emergency_contact_phone:emergencyPhone.value.trim()||null}});if(!d||d.success!==true)throw Error(d?.message||d?.error||"客户资料保存失败");let r=await auth("/api/customer/record");C=Array.isArray(r)?r[0]:r;renderHeader();toast("资料保存成功")}catch(e){toast(e.message||"资料保存失败")}finally{saveBtn.disabled=false}}
function detail(id){location.href="./customer_order_detail.html?id="+encodeURIComponent(id)}function logout(){save(null);login()}function forceLogout(){save(null);P=C=null;login()}function login(){location.replace("./login.html")}function mask(v){v=String(v||"");return v.length>=7?v.slice(0,3)+"****"+v.slice(-4):v||"--"}function safe(v){return String(v??"").replace(/'/g,"")}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function date(v){if(!v)return"-";let d=new Date(v);return Number.isNaN(d.getTime())?"-":d.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})}function toast(m){let e=document.getElementById("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2300)}
</script></body></html>
