<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荷序健康｜首次推荐注册</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#263b34;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:510px;margin:0 auto;min-height:100vh;padding:36px 18px}.card{background:#fff;border:1px solid #d9e4dd;padding:28px 23px;border-radius:15px;box-shadow:0 8px 30px #21483a12}h1{font-size:24px;color:#155e50;margin:0 0 10px}p{line-height:1.7;color:#61736b;font-size:14px}label{display:block;margin:19px 0 7px;font-size:14px;font-weight:600}input{width:100%;height:46px;border:1px solid #b8cfc2;border-radius:7px;padding:0 12px;font-size:16px;background:white}.otp{display:flex;gap:8px}.otp input{flex:1;min-width:0}.otp button{flex:0 0 136px;min-height:50px;touch-action:manipulation;white-space:nowrap;font-size:14px}button{min-height:46px;border:0;border-radius:7px;background:#176452;color:#fff;font-weight:700;cursor:pointer;padding:0 12px}button:disabled{opacity:.5;cursor:not-allowed}.main{width:100%;margin-top:24px}#message{min-height:28px;color:#a33e44}.muted{font-size:12px}a{color:#176452}select{width:100%;height:46px;border:1px solid #b8cfc2;border-radius:7px;padding:0 12px;font-size:16px;background:#fff;color:#263b34}select:disabled{background:#f3f4f1;color:#829087}</style></head><body><div class="wrap"><div class="card"><h1>欢迎加入荷序健康</h1><p id="referrer">正在验证推荐二维码…</p><p>首次注册需要有效推荐二维码，短信验证后自动绑定推荐关系。以后可以直接进入客户服务平台。</p><label for="phone">手机号码</label><input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请输入11位中国大陆手机号"><label for="otp">短信验证码</label><div class="otp"><input id="otp" inputmode="numeric" maxlength="6" placeholder="6位验证码"><button id="send" type="button" disabled>获取验证码</button></div><label for="nickname">姓名或昵称</label><input id="nickname" maxlength="40" placeholder="请输入姓名或昵称"><label for="province">服务省份</label><select id="province"><option value="">请选择省份</option></select><label for="city">服务城市</label><select id="city" disabled><option value="">请先选择省份</option></select><button class="main" id="register" type="button" disabled>验证并完成注册</button><p id="message" role="status"></p><p class="muted">已经注册？<a href="./qr_login.html">直接进入客户服务平台</a></p></div></div><script>
const $=id=>document.getElementById(id),ref=(new URLSearchParams(location.search).get('ref')||'').trim();let valid=false,busy=false,serviceAreas=[];
function msg(s){$('message').textContent=s||''}function phone(){const p=$('phone').value.replace(/\D/g,'');return /^1\d{10}$/.test(p)?'+86'+p:null}
async function api(path,body,token){const h={Accept:'application/json'};if(body!==undefined)h['Content-Type']='application/json';if(token)h.Authorization='Bearer '+token;const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let d;try{d=await r.json()}catch{throw Error('服务器返回格式异常')}if(!r.ok||d?.success===false)throw Error(d?.error||d?.message||'操作失败');return d}
function fillCities(){
 const province=$('province').value,city=$('city');
 city.innerHTML='<option value="">请选择城市</option>';
 for(const x of serviceAreas.filter(x=>String(x.province_id)===province)){
   const opt=document.createElement('option');opt.value=String(x.city_id);opt.textContent=x.city_name;city.appendChild(opt);
 }
 city.disabled=!province||city.options.length===1;
}
$('province').onchange=fillCities;
async function loadServiceAreas(){
 const d=await api('/api/customer/first-profile-options');
 serviceAreas=Array.isArray(d.areas)?d.areas:[];
 if(!serviceAreas.length)throw Error('当前没有可选的已开通城市，请联系管理员检查服务区域配置');
 const provinces=new Set();
 for(const x of serviceAreas){
  if(provinces.has(String(x.province_id)))continue;
  provinces.add(String(x.province_id));
  const opt=document.createElement('option');opt.value=String(x.province_id);opt.textContent=x.province_name;$('province').appendChild(opt);
 }
}
async function init(){
 if(!/^(?:[a-f0-9]{32}|[a-f0-9]{48})$/i.test(ref)){msg('推荐链接无效，请重新扫码');return}
 try{
  const d=await api('/api/referrals/resolve?ref='+encodeURIComponent(ref));
  $('referrer').textContent='推荐人：'+(d.referrer?.display_name||'荷序健康用户');
  valid=true;$('send').disabled=false;
  const rp=String(d.referrer?.province_id||''),rc=String(d.referrer?.city_id||'');
  try{
   await loadServiceAreas();
   if(rp&&rc&&serviceAreas.some(x=>String(x.province_id)===rp&&String(x.city_id)===rc)){
    $('province').value=rp;fillCities();$('city').value=rc;
   }
   $('register').disabled=false;msg('');
  }catch(e){
   msg('城市列表加载失败：'+e.message+'。请刷新页面重试。');
  }
 }catch(e){$('referrer').textContent='推荐二维码不可用';msg(e.message)}
}
$('send').onclick=async()=>{if(!valid)return;const p=phone();if(!p)return msg('请输入正确的11位手机号码');const b=$('send');b.disabled=true;try{await api('/api/auth/send-otp',{phone:p});msg('验证码已发送，请查看短信');let n=60;const t=setInterval(()=>{n--;b.textContent=n+'秒';if(n<=0){clearInterval(t);b.disabled=false;b.textContent='重新发送'}},1000)}catch(e){msg(e.message);b.disabled=false}};
$('register').onclick=async()=>{if(busy||!valid)return;const p=phone(),otp=$('otp').value.trim(),nickname=$('nickname').value.trim(),province_id=Number($('province').value),city_id=Number($('city').value);if(!p||!/^\d{6}$/.test(otp))return msg('请填写正确的手机号和6位验证码');if(!nickname)return msg('请填写姓名或昵称');if(!province_id||!city_id)return msg('请选择服务省份和城市');busy=true;$('register').disabled=true;try{const auth=await api('/api/auth/verify-otp',{phone:p,token:otp});if(!auth.access_token||!auth.user)throw Error('短信验证失败');await api('/api/customer/referral-register',{ref,nickname},auth.access_token);await api('/api/customer/first-profile',{nickname,province_id,city_id},auth.access_token);localStorage.setItem('hexu_customer_session_v1',JSON.stringify(auth));msg('注册成功，正在进入客户服务平台…');location.replace('./qr_login.html')}catch(e){msg(e.message||'注册失败，请重试')}finally{busy=false;$('register').disabled=!serviceAreas.length}};
init();</script></body></html>
