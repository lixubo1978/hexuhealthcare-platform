<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>荷序健康｜首次推荐注册</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3ed;color:#263b34;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:510px;margin:0 auto;min-height:100vh;padding:36px 18px}
.card{background:#fff;border:1px solid #d9e4dd;padding:28px 23px;border-radius:15px;box-shadow:0 8px 30px #21483a12}
h1{font-size:24px;color:#155e50;margin:0 0 10px}
p{line-height:1.7;color:#61736b;font-size:14px}
label{display:block;margin:19px 0 7px;font-size:14px;font-weight:600}
input{width:100%;height:46px;border:1px solid #b8cfc2;border-radius:7px;padding:0 12px;font-size:16px;background:white}
.otp{display:flex;gap:8px}
.otp input{flex:1;min-width:0}
.otp button{flex:0 0 136px;min-height:50px;touch-action:manipulation;white-space:nowrap;font-size:14px}
button{min-height:46px;border:0;border-radius:7px;background:#176452;color:#fff;font-weight:700;cursor:pointer;padding:0 12px}
button:disabled{opacity:.5;cursor:not-allowed}
.main{width:100%;margin-top:24px}
#message{min-height:28px;color:#a33e44}
.muted{font-size:12px}
a{color:#176452}
select{width:100%;height:46px;border:1px solid #b8cfc2;border-radius:7px;padding:0 12px;font-size:16px;background:#fff;color:#263b34}
select:disabled{background:#f3f4f1;color:#829087}
.concerns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.concern{display:flex;align-items:center;gap:8px;margin:0;padding:11px 9px;border:1px solid #d9e4dd;border-radius:7px;background:#fff;font-size:13px;font-weight:500}
.concern input{width:18px;height:18px;flex:0 0 18px;accent-color:#176452}
.concern span{line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <h1>欢迎加入荷序健康</h1>
  <p id="referrer">正在验证推荐二维码…</p>
  <p>首次注册请填写完整资料。通过推荐二维码进入的客户将按规则绑定推荐关系；普通登录入口注册不绑定推荐人。</p>

  <label for="phone">手机号码</label>
  <input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请输入11位中国大陆手机号">

  <label for="otp">短信验证码</label>
  <div class="otp">
    <input id="otp" inputmode="numeric" maxlength="6" placeholder="6位验证码">
    <button id="send" type="button" disabled>获取验证码</button>
  </div>

  <label for="nickname">姓名或昵称</label>
  <input id="nickname" maxlength="40" placeholder="请输入姓名或昵称">

  <label for="province">服务省份</label>
  <select id="province">
    <option value="">请选择省份</option>
  </select>

  <label for="city">服务城市</label>
  <select id="city" disabled>
    <option value="">请先选择省份</option>
  </select>

  <label for="gender">性别</label>
  <select id="gender">
    <option value="">请选择（可不填）</option>
    <option value="男">男</option>
    <option value="女">女</option>
  </select>

  <label for="age">年龄</label>
  <input id="age" type="number" min="0" max="120" inputmode="numeric" placeholder="请输入年龄（可不填）">

  <label for="fertility">生育状况</label>
  <select id="fertility">
    <option value="">请选择（可不填）</option>
    <option value="未育">未育</option>
    <option value="孕期">孕期</option>
    <option value="已育">已育</option>
  </select>

  <label>目前面临的问题（可多选，可不填）</label>
  <div class="concerns">
    <label class="concern"><input type="checkbox" name="concern" value="心理情绪"><span>心理情绪</span></label>
    <label class="concern"><input type="checkbox" name="concern" value="育儿相关"><span>育儿相关</span></label>
    <label class="concern"><input type="checkbox" name="concern" value="睡眠"><span>睡眠</span></label>
    <label class="concern"><input type="checkbox" name="concern" value="体质情况"><span>体质情况</span></label>
    <label class="concern"><input type="checkbox" name="concern" value="孕产相关"><span>孕产相关</span></label>
    <label class="concern"><input type="checkbox" name="concern" value="形体"><span>形体</span></label>
    <label class="concern"><input type="checkbox" name="concern" value="生殖健康"><span>生殖健康</span></label>
  </div>

  <p class="muted">以上信息用于了解您的健康服务需求，属于敏感个人信息；自愿填写，不影响注册。仅用于提供相关健康服务，不公开展示。</p>

  <button class="main" id="register" type="button" disabled>验证并完成注册</button>
  <p id="message" role="status"></p>
  <p class="muted">已经注册？<a href="./qr_login.html">直接进入客户服务平台</a></p>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ref = (params.get('ref') || '').trim();
const fromLogin = ['login','qr_login'].includes(params.get('source'));

let valid = false;
let busy = false;
let serviceAreas = [];

function msg(s) {
  $('message').textContent = s || '';
}

// 兼容 +86、86、0086 和纯11位手机号，界面只显示11位。
function localPhone(value) {
  let p = String(value || '').replace(/\D/g, '');
  if (p.startsWith('0086') && p.length === 15) p = p.slice(4);
  else if (p.startsWith('86') && p.length === 13) p = p.slice(2);
  return /^1\d{10}$/.test(p) ? p : '';
}
function phone() {
  const p = localPhone($('phone').value);
  return p ? '+86' + p : null;
}

async function api(path, body, token) {
  const h = {Accept:'application/json'};
  if (body !== undefined) h['Content-Type'] = 'application/json';
  if (token) h.Authorization = 'Bearer ' + token;

  const r = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: h,
    body: body === undefined ? undefined : JSON.stringify(body),
    cache: 'no-store'
  });

  let d;
  try {
    d = await r.json();
  } catch {
    throw Error('服务器返回格式异常');
  }

  if (!r.ok || d?.success === false) {
    throw Error(d?.error || d?.message || '操作失败');
  }
  return d;
}

function fillCities() {
  const province = String($('province').value || '');
  const city = $('city');

  city.replaceChildren(
    new Option(
      province ? '请选择城市' : '请先选择省份',
      ''
    )
  );

  const seen = new Set();

  for (const x of serviceAreas) {
    if (String(x.province_id) !== province) continue;

    const id = String(x.city_id || '');
    if (!id || seen.has(id)) continue;

    seen.add(id);
    city.add(
      new Option(String(x.city_name || '城市 ' + id), id)
    );
  }

  city.disabled = !province || seen.size === 0;
  city.value = '';
}

$('province').addEventListener('change', fillCities);

// 普通注册与推荐注册统一使用公开接口。
// 不传入登录令牌，不区分注册来源。
async function loadServiceAreas() {
  const d = await api('/api/customer/first-profile-options');

  serviceAreas = Array.isArray(d.areas) ? d.areas : [];

  if (!serviceAreas.length) {
    throw Error(
      '当前没有可选的已开通城市，请联系管理员检查服务区域配置'
    );
  }

  const province = $('province');
  province.replaceChildren(
    new Option('请选择省份', '')
  );

  const seen = new Set();

  for (const x of serviceAreas) {
    const id = String(x.province_id || '');

    if (!id || seen.has(id)) continue;

    seen.add(id);
    province.add(
      new Option(String(x.province_name || '省份 ' + id), id)
    );
  }

  province.value = '';
  fillCities();
}

async function init() {
  if (fromLogin) {
    let session = null;

    try {
      session = JSON.parse(
        localStorage.getItem('hexu_customer_session_v1') || 'null'
      );
    } catch {
      session = null;
    }

    if (!session?.access_token) {
      $('referrer').textContent = '普通客户注册 · 无推荐人';
      msg('登录状态已失效，请返回登录页重新验证手机号');
      return;
    }

    const urlPhone = params.get('phone') || '';
    const sessionPhone = String(session.user?.phone || '');
    if (sessionPhone && urlPhone && localPhone(sessionPhone) !== localPhone(urlPhone)) {
      $('referrer').textContent = '手机号验证不一致';
      msg('登录手机号不匹配，请返回重新验证');
      return;
    }

    const verifiedPhone = localPhone(sessionPhone || urlPhone);
    if (!verifiedPhone) {
      $('referrer').textContent = '手机号验证异常';
      msg('无法识别已验证手机号，请返回重新登录');
      return;
    }
    $('phone').value = verifiedPhone;
    $('phone').readOnly = true;

    // 修复原代码 previousElementSibling 为 null 的错误。
    $('otp').closest('.otp').style.display = 'none';

    const otpLabel = document.querySelector('label[for="otp"]');
    if (otpLabel) {
      otpLabel.style.display = 'none';
    }

    if (ref) {
      if (!/^(?:[a-f0-9]{32}|[a-f0-9]{48})$/i.test(ref)) {
        msg('推荐链接无效，请重新扫码');
        return;
      }
      try {
        const d = await api('/api/referrals/resolve?ref=' + encodeURIComponent(ref));
        $('referrer').textContent = '推荐人：' + (d.referrer?.display_name || '荷序健康用户');
      } catch (e) {
        msg('推荐二维码不可用：' + e.message);
        return;
      }
    } else {
      $('referrer').textContent = '普通客户注册 · 无推荐人';
    }
    valid = true;

    try {
      // 公开读取省市，与推荐二维码入口完全相同。
      await loadServiceAreas();

      $('register').disabled = false;
      msg('手机号已验证，请补充注册资料。');
    } catch (e) {
      msg('城市列表加载失败：' + e.message);
    }

    return;
  }

  if (!/^(?:[a-f0-9]{32}|[a-f0-9]{48})$/i.test(ref)) {
    $('referrer').textContent = '推荐二维码不可用';
    msg('推荐链接无效，请重新扫码');
    return;
  }

  try {
    const d = await api(
      '/api/referrals/resolve?ref=' + encodeURIComponent(ref)
    );

    $('referrer').textContent =
      '推荐人：' +
      (d.referrer?.display_name || '荷序健康用户');

    valid = true;
    $('send').disabled = false;

    try {
      // 同一个公开省市接口。
      await loadServiceAreas();

      $('register').disabled = false;
      msg('');
    } catch (e) {
      msg('城市列表加载失败：' + e.message + '。请刷新页面重试。');
    }
  } catch (e) {
    $('referrer').textContent = '推荐二维码不可用';
    msg(e.message);
  }
}

$('send').onclick = async () => {
  if (!valid) return;

  const p = phone();
  if (!p) return msg('请输入正确的11位手机号码');

  const b = $('send');
  b.disabled = true;

  try {
    await api('/api/auth/send-otp', {phone:p});

    msg('验证码已发送，请查看短信');

    let n = 60;
    b.textContent = n + '秒';

    const t = setInterval(() => {
      n--;
      b.textContent = n + '秒';

      if (n <= 0) {
        clearInterval(t);
        b.disabled = false;
        b.textContent = '重新发送';
      }
    }, 1000);
  } catch (e) {
    msg(e.message);
    b.disabled = false;
    b.textContent = '获取验证码';
  }
};

$('register').onclick = async () => {
  if (busy || !valid) return;

  const p = phone();
  const otp = $('otp').value.trim();
  const nickname = $('nickname').value.trim();
  const province_id = Number($('province').value);
  const city_id = Number($('city').value);

  if (!p || (!fromLogin && !/^\d{6}$/.test(otp))) {
    return msg('请填写正确的手机号和6位验证码');
  }

  if (!nickname) {
    return msg('请填写姓名或昵称');
  }

  if (!province_id || !city_id) {
    return msg('请选择服务省份和城市');
  }

  if (
    $('age').value !== '' &&
    (
      !Number.isInteger(Number($('age').value)) ||
      Number($('age').value) < 0 ||
      Number($('age').value) > 120
    )
  ) {
    return msg('年龄须为0到120的整数');
  }

  busy = true;
  $('register').disabled = true;

  try {
    const auth = fromLogin
      ? JSON.parse(
          localStorage.getItem('hexu_customer_session_v1') || 'null'
        )
      : await api('/api/auth/verify-otp', {
          phone:p,
          token:otp
        });

    if (!auth?.access_token) {
      throw Error('短信验证失败');
    }

    if (fromLogin && !ref) {
      // 普通注册：不绑定推荐人。
      await api(
        '/api/customer/login-prepare',
        {phone:p},
        auth.access_token
      );
    } else {
      // 推荐注册：按推荐码建立推荐关系。
      await api(
        '/api/customer/referral-register',
        {ref,nickname},
        auth.access_token
      );
    }

    await api(
      '/api/customer/first-profile',
      {nickname,province_id,city_id},
      auth.access_token
    );

    await api(
      '/api/customer/referral-health-profile',
      {
        gender:$('gender').value,
        age:$('age').value === ''
          ? null
          : Number($('age').value),
        fertility_status:$('fertility').value,
        concerns:[
          ...document.querySelectorAll(
            'input[name=concern]:checked'
          )
        ].map(x => x.value)
      },
      auth.access_token
    );

    localStorage.setItem(
      'hexu_customer_session_v1',
      JSON.stringify(auth)
    );

    msg('注册成功，正在进入客户服务平台…');
    const resume = params.get('return');
    // 仅允许返回站内 qr_login 页面，不接受外部跳转。
    if (resume && /^\/?qr_login\.html\?resume_order=1$/.test(resume)) {
      location.replace('./qr_login.html?resume_order=1');
    } else {
      location.replace('./qr_login.html');
    }
  } catch (e) {
    msg(e.message || '注册失败，请重试');
  } finally {
    busy = false;
    $('register').disabled = !serviceAreas.length;
  }
};

init();
</script>
</body>
</html>
