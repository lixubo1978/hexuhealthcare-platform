<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>裂变管理｜荷序健康</title>
<style>
:root{--green:#0b5051;--deep:#103537;--cream:#f4f0e6;--paper:#fffcf7;--line:#d3dcd4;--muted:#64716a}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#233633;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:18px 5%}.head{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:22px;letter-spacing:2px;color:var(--green);font-weight:650}.brand small{display:block;font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:400}.back{border:1px solid var(--green);padding:9px 14px;color:var(--green)}main{max-width:1400px;margin:30px auto;padding:0 20px}.hero{background:var(--green);color:var(--paper);padding:28px}.hero h1{font-family:"Songti SC",serif;font-weight:400;font-size:30px;margin:0 0 8px}.hero p{color:#d1e1d9;margin:0;font-size:13px;line-height:1.8}.notice{background:var(--paper);border:1px solid var(--line);padding:14px 18px;margin:18px 0;font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);padding:22px;min-height:178px}.card .ico{font-size:27px}.card h2{font-size:16px;color:var(--green);margin:14px 0 8px}.card p{font-size:12px;color:var(--muted);line-height:1.8;margin:0}.status{display:inline-block;margin-top:14px;color:var(--muted);font-size:11px;border:1px solid var(--line);padding:3px 7px}.loading{min-height:70vh;display:grid;place-items:center;padding:25px;text-align:center;color:var(--muted)}.hidden{display:none!important}.error{color:#a93243}footer{padding:24px 0;color:var(--muted);font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.grid{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:25px}}
</style>
</head>
<body>
<div id="gate" class="loading">正在验证荷序健康平台管理权限……</div>
<div id="app" class="hidden">
<header><div class="head"><div class="brand">荷序健康<small>HEXU HEALTHCARE · REFERRAL MANAGEMENT</small></div><a class="back" href="wholemanagement.html">← 返回管理首页</a></div></header>
<main><section class="hero"><h1>全民裂变管理</h1><p>四种身份统一推荐 · 独立授权分成 · 180天动态绑定 · 六方动态分账</p></section>
<div class="notice">当前为第一阶段管理界面框架。尚未接入裂变业务数据库和API，以下模块仅展示开发规划，不会产生真实授权、绑定或分账操作。</div>
<div class="grid" id="modules"></div>
<footer>荷序健康 · 全民裂变系统 · 分阶段开发</footer></main></div>
<script>
'use strict';
const SESSION_KEY='sb-qbuqjwpkltbjhlfbyjyb-auth-token';
const modules=[
['🔳','推荐二维码','四种身份自动拥有唯一推荐二维码。'],
['👥','全民推荐绑定','扫码后自动建立客户推荐关系。'],
['🔐','推荐分成授权','独立审核，默认8%，可设置二维码比例。'],
['🧾','订单来源识别','取消客户手动选择，由后台自动识别。'],
['🔗','客户唯一绑定','一个客户仅有一个有效推荐人。'],
['📅','180天动态续期','符合条件的实际服务核销后顺延。'],
['↩️','退款与绑定回滚','全额退款撤销续期，部分退款严格核验。'],
['💰','六方动态分账','订单快照、退款冲回及已结算追回。']
];
function getToken(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')?.access_token||''}catch{return''}}
async function verify(){const gate=document.getElementById('gate');try{const token=getToken();if(!token){location.replace('login.html');return}const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),15000);let r;try{r=await fetch('/api/auth/business-identity',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store',signal:ctrl.signal})}finally{clearTimeout(timeout)}if(!r.ok)throw Error('身份验证失败（'+r.status+'）');const data=await r.json();const u=data?.user,p=data?.profile||{role:data?.role,status:data?.status};if(!u||!p||p.status!=='active'||!['founder','platform_admin'].includes(p.role)){gate.classList.add('error');gate.textContent='当前账号没有裂变管理权限。请使用创始人或平台管理员账号登录。';return}document.getElementById('modules').innerHTML=modules.map(([icon,name,desc],i)=>'<article class="card"><div class="ico">'+icon+'</div><h2>'+(i+1)+'. '+name+'</h2><p>'+desc+'</p><span class="status">待开发</span></article>').join('');gate.classList.add('hidden');document.getElementById('app').classList.remove('hidden')}catch(e){gate.classList.add('error');gate.textContent='验证失败：'+e.message+'。请返回管理首页重新登录。'}}
verify();
</script>
</body></html>
