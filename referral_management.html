<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>裂变管理｜荷序健康</title><style>
:root{--green:#0b5051;--cream:#f4f0e6;--paper:#fffcf7;--line:#d3dcd4}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#233633}header{background:var(--green);color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}header a{color:white;white-space:nowrap}main{max-width:1450px;margin:25px auto;padding:0 18px}h1{font-size:23px;margin:0}.note{background:var(--paper);padding:15px;margin-bottom:15px;border:1px solid var(--line)}.filters{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;margin-bottom:12px}input,select,button{font:inherit;padding:9px;border:1px solid var(--line);min-height:40px}button{background:var(--green);color:white;cursor:pointer}button:disabled{opacity:.5}.tablewrap{overflow:auto;background:var(--paper);border:1px solid var(--line)}table{width:100%;min-width:1050px;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:11px;text-align:left;white-space:nowrap}th{background:#e4efea}.off{color:#b33442}.on{color:#0b5051}dialog{border:1px solid var(--line);background:var(--paper);width:min(520px,94vw);padding:22px}dialog label{display:block;margin:12px 0}dialog menu{padding:0;display:flex;justify-content:flex-end;gap:10px}#link{width:100%}#qr{width:220px;height:220px;background:white;border:1px solid var(--line)}#status{margin:12px 0}@media(max-width:850px){.filters{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>荷序健康 · 推荐二维码统一管理</h1><a href="wholemanagement.html">← 返回管理首页</a></header><main><div class="note">四种身份自动登记。二维码启用与分成授权独立管理，未授权默认不获得现金分成。扫码后先完成手机验证码登录；推荐绑定有效期180天，订单付款且全部核销完成后自动续期180天。</div><div class="filters"><select id="province"><option value="">全部省份</option></select><select id="city"><option value="">全部城市</option></select><select id="kind"><option value="">全部身份</option><option value="merchant">商户</option><option value="technician">技师</option><option value="consultant">健康顾问</option><option value="customer">客户</option></select><select id="enabled"><option value="">全部启停</option><option value="true">已启用</option><option value="false">已禁用</option></select><select id="auth"><option value="">全部授权</option><option value="true">已授权</option><option value="false">未授权</option></select><input id="keyword" placeholder="姓名 / 编号"></div><button id="refresh">刷新数据</button><div id="status">正在验证管理权限……</div><div class="tablewrap"><table><thead><tr><th>编号</th><th>身份</th><th>姓名/名称</th><th>省份</th><th>城市</th><th>原身份</th><th>二维码</th><th>分成授权</th><th>比例</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<dialog id="edit"><h3>管理推荐二维码</h3><p id="who"></p><label><input type="checkbox" id="qrEnabled"> 二维码启用</label><label><input type="checkbox" id="authorized"> 授权现金分成</label><label>授权比例（%） <input type="number" id="rate" min="0" max="100" step="0.001" value="8"></label><menu><button type="button" id="cancel">取消</button><button type="button" id="save">保存</button></menu></dialog>
<dialog id="view"><h3>专属推荐二维码</h3><p id="qrName"></p><img id="qr" alt="推荐二维码"><p>分享链接</p><input id="link" readonly><menu><button id="copy">复制链接</button><button id="closeView">关闭</button></menu></dialog>
<script>
'use strict';const KEY='sb-qbuqjwpkltbjhlfbyjyb-auth-token';let all=[],provinces=[],cities=[],editing=null;const $=id=>document.getElementById(id);const names={merchant:'商户',technician:'技师',consultant:'健康顾问',customer:'客户'};function token(){try{return JSON.parse(localStorage.getItem(KEY)||'null')?.access_token||''}catch{return ''}}async function api(path,options={}){const t=token();if(!t)throw Error('请先登录');const r=await fetch(path,{...options,cache:'no-store',headers:{Authorization:'Bearer '+t,Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...options.headers}});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw Error('API返回非JSON内容（HTTP '+r.status+'），请检查Worker路由：'+path)}if(!r.ok||d.success===false)throw Error((r.status===404?'API接口未部署或未正确路由：'+path+'；':'')+(d.error||'请求失败'));return d}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function options(id,rows,key,label){$(id).innerHTML='<option value="">全部'+(id==='province'?'省份':'城市')+'</option>'+rows.map(r=>'<option value="'+r[key]+'">'+esc(r[label])+'</option>').join('')}
function render(){const p=$('province').value,c=$('city').value,k=$('kind').value,e=$('enabled').value,a=$('auth').value,q=$('keyword').value.trim().toLowerCase(),pm=new Map(provinces.map(x=>[String(x.id),x.province_name])),cm=new Map(cities.map(x=>[String(x.id),x.city_name]));const rows=all.filter(x=>(!p||String(x.province_id)===p)&&(!c||String(x.city_id)===c)&&(!k||x.kind===k)&&(!e||String(x.qr_enabled)===e)&&(!a||String(x.authorized)===a)&&(!q||[x.display_name,x.entity_id,x.id].some(v=>String(v||'').toLowerCase().includes(q))));$('status').textContent='共 '+rows.length+' 条 / 总计 '+all.length+' 条';$('rows').innerHTML=rows.map(x=>'<tr><td>'+x.id+'</td><td>'+names[x.kind]+'</td><td>'+esc(x.display_name)+'</td><td>'+esc(pm.get(String(x.province_id))||'—')+'</td><td>'+esc(cm.get(String(x.city_id))||'—')+'</td><td class="'+(x.source_active?'on':'off')+'">'+(x.source_active?'有效':'失效')+'</td><td class="'+(x.qr_enabled?'on':'off')+'">'+(x.qr_enabled?'启用':'禁用')+'</td><td>'+(x.authorized?'已授权':'未授权')+'</td><td>'+(x.authorized?x.rate+'%':'0%')+'</td><td><button data-action="view" data-id="'+x.id+'">查看</button> <button data-action="edit" data-id="'+x.id+'">设置</button></td></tr>').join('')||'<tr><td colspan="10">没有符合条件的记录</td></tr>'}
async function load(){try{$('status').textContent='正在读取……';const identity=await api('/api/auth/business-identity');if(!['founder','platform_admin'].includes(identity.profile?.role)||identity.profile?.status!=='active')throw Error('没有裂变管理权限');const d=await api('/api/admin/referrals/list');all=d.referrals||[];provinces=d.provinces||[];cities=d.cities||[];options('province',provinces,'id','province_name');updateCities();render()}catch(e){$('status').textContent='读取失败：'+e.message+'。请确认已部署本次Worker，并已执行第一版referral_v1.sql。'}}
function updateCities(){const p=$('province').value;options('city',cities.filter(x=>!p||String(x.province_id)===p),'id','city_name')}
$('province').onchange=()=>{updateCities();render()};['city','kind','enabled','auth'].forEach(id=>$(id).onchange=render);$('keyword').oninput=render;$('refresh').onclick=load;$('rows').onclick=ev=>{const b=ev.target.closest('button[data-id]');if(!b)return;const x=all.find(v=>String(v.id)===b.dataset.id);if(!x)return;if(b.dataset.action==='edit'){editing=x;$('who').textContent=names[x.kind]+' · '+x.display_name;$('qrEnabled').checked=x.qr_enabled;$('authorized').checked=x.authorized;$('rate').value=x.rate;$('edit').showModal()}else{const url='https://www.hexuhealthcare.com/qr_login.html?ref='+encodeURIComponent(x.token);$('qrName').textContent=x.display_name+'（'+names[x.kind]+'）';$('link').value=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url);$('view').showModal()}};
$('cancel').onclick=()=>$('edit').close();$('closeView').onclick=()=>$('view').close();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('link').value);alert('已复制')}catch{$('link').select();document.execCommand('copy')}};$('save').onclick=async()=>{if(!editing)return;const rate=Number($('rate').value);if(!Number.isFinite(rate)||rate<0||rate>100)return alert('比例应在0至100之间');$('save').disabled=true;try{await api('/api/admin/referrals/update',{method:'POST',body:JSON.stringify({id:editing.id,qr_enabled:$('qrEnabled').checked,authorized:$('authorized').checked,rate})});$('edit').close();await load()}catch(e){alert('保存失败：'+e.message)}finally{$('save').disabled=false}};load();
</script></body></html>
