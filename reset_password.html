<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4f0e6"><title>荷序健康 - 设置新密码</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,#fffcf7,#f4f0e6 48%,#eef1e7);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#233633}.page{width:min(430px,100%)}.brand{text-align:center;margin-bottom:22px}.brand img{width:58px;height:58px;object-fit:contain;vertical-align:middle;margin-right:10px}.brand strong{font-size:27px;letter-spacing:2px;color:#0b5051;vertical-align:middle}.card{background:#fffcf7;border:1px solid #d8d4c9;border-radius:24px;padding:25px;box-shadow:0 18px 50px #1035371f}.card h1{margin:0 0 8px;color:#0b5051;font-size:22px}.desc{margin-bottom:20px;color:#64716a;font-size:13px;line-height:1.7}.field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;font-size:14px;font-weight:650}.input{width:100%;height:52px;border:1px solid #cbd3c6;border-radius:14px;padding:0 14px;font-size:16px;outline:none}.input:focus{border-color:#176968;box-shadow:0 0 0 4px #17696820}.btn{width:100%;height:54px;border:0;border-radius:15px;background:#0b5051;color:#fff;font-size:16px;font-weight:750}.btn:disabled{opacity:.55}.back{width:100%;height:50px;margin-top:10px;border:1px solid #cbd3c6;border-radius:15px;background:#fff;color:#0b5051;font-weight:650}.msg{display:none;margin:0 0 14px;padding:11px 12px;border-radius:12px;font-size:13px;line-height:1.55}.msg.show{display:block}.msg.error{background:#fff0f3;color:#b4234d;border:1px solid #ffd1dc}.msg.success{background:#f0faf4;color:#26734d;border:1px solid #d7f0df}</style></head><body><div class="page"><div class="brand"><img src="./logo.jpeg" alt="荷序健康"><strong>荷序健康</strong></div><main class="card"><h1>设置新密码</h1><div class="desc">请设置新的登录密码。完成后，创始人、管理人员、城市合伙人、商户、技术服务人员和健康顾问均使用新密码登录。</div><div id="msg" class="msg"></div><div class="field"><label for="password">新密码</label><input id="password" class="input" type="password" autocomplete="new-password" maxlength="72" placeholder="8 至 72 位"></div><div class="field"><label for="confirmPassword">再次输入新密码</label><input id="confirmPassword" class="input" type="password" autocomplete="new-password" maxlength="72" placeholder="再次输入新密码"></div><button id="save" class="btn" type="button">确认设置新密码</button><button class="back" type="button" onclick="location.href='./login.html'">返回登录</button></main></div><script>
const SUPABASE_URL="https://qbuqjwpkltbjhlfbyjyb.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";
const msg=document.getElementById("msg");
const save=document.getElementById("save");
let client=null;
let recoveryReady=false;

function show(t,type="error"){
  msg.textContent=t;
  msg.className="msg show "+type;
}
function clearMsg(){
  msg.textContent="";
  msg.className="msg";
}
function disableForm(disabled){
  document.getElementById("password").disabled=disabled;
  document.getElementById("confirmPassword").disabled=disabled;
  save.disabled=disabled;
}
function readableRecoveryError(error){
  const t=String(error?.message||error||"").toLowerCase();
  if(t.includes("expired"))return"密码重置链接已经过期，请返回登录页重新申请。";
  if(t.includes("invalid")||t.includes("token"))return"密码重置链接无效或已经使用过，请重新申请。";
  return"密码重置链接无效或已经过期，请返回登录页重新申请。";
}

async function initializeRecovery(){
  try{
    if(!window.supabase||typeof window.supabase.createClient!=="function"){
      throw new Error("认证组件加载失败，请刷新页面重试。");
    }

    client=window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
    );

    client.auth.onAuthStateChange((event,session)=>{
      if(event==="PASSWORD_RECOVERY"&&session){
        recoveryReady=true;
        clearMsg();
        disableForm(false);
      }
    });

    const query=new URLSearchParams(location.search);
    const hash=new URLSearchParams(location.hash.replace(/^#/,""));

    const errorDescription=
      query.get("error_description")||
      hash.get("error_description");

    if(errorDescription){
      throw new Error(decodeURIComponent(errorDescription));
    }

    /* PKCE：若邮件最终回跳为 ?code=...，显式换取 session。 */
    const code=query.get("code");
    if(code){
      const {data,error}=await client.auth.exchangeCodeForSession(code);
      if(error)throw error;
      if(data?.session)recoveryReady=true;
    }

    /* Implicit：detectSessionInUrl 会读取 #access_token / #refresh_token。 */
    if(!recoveryReady){
      const {data,error}=await client.auth.getSession();
      if(error)throw error;
      if(data?.session)recoveryReady=true;
    }

    if(recoveryReady){
      clearMsg();
      disableForm(false);

      /* 去掉 URL 中的一次性 token/code，避免刷新或复制地址时泄露。 */
      if(location.search||location.hash){
        history.replaceState(null,"",location.pathname);
      }
      document.getElementById("password").focus();
    }else{
      disableForm(true);
      show("密码重置链接无效或已经过期，请返回登录页重新申请。");
    }
  }catch(error){
    console.error("PASSWORD RECOVERY INIT ERROR",error);
    disableForm(true);
    show(readableRecoveryError(error));
  }
}

save.onclick=async()=>{
  if(!client||!recoveryReady){
    show("密码重置链接无效或已经过期，请重新申请。");
    return;
  }

  const p=document.getElementById("password").value;
  const c=document.getElementById("confirmPassword").value;

  if(p.length<8)return show("新密码至少需要8位。");
  if(p.length>72)return show("新密码不能超过72位。");
  if(p!==c)return show("两次输入的新密码不一致。");

  save.disabled=true;
  save.textContent="正在保存...";

  try{
    const {data,error}=await client.auth.getSession();
    if(error||!data?.session){
      throw new Error("密码重置链接无效或已经过期，请重新申请。");
    }

    const {error:updateError}=await client.auth.updateUser({
      password:p,
      data:{must_change_password:false}
    });
    if(updateError)throw updateError;

    show("密码修改成功，正在返回登录页面。","success");

    /* 只结束本次 recovery 浏览器 session，避免影响用户其他设备。 */
    await client.auth.signOut({scope:"local"});
    localStorage.removeItem("sb-qbuqjwpkltbjhlfbyjyb-auth-token");

    setTimeout(()=>location.replace("./login.html"),1200);
  }catch(error){
    console.error("PASSWORD UPDATE ERROR",error);
    show(error?.message||"密码修改失败，请重新申请重置链接。");
    save.disabled=false;
    save.textContent="确认设置新密码";
  }
};

disableForm(true);
initializeRecovery();
</script></body></html>
