<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的订单 - 荷序健康</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--pink:#ff6f9f;--pink-dark:#f05286;--pink-light:#fff0f5;--pink-soft:#fff7fa;--text:#49363e;--text-light:#9b7f89;--border:#f4e3e9;--white:#ffffff;--green:#31a875;--orange:#e79b2f;--red:#e75b70;--blue:#5788c7;--shadow:0 8px 24px rgba(210,120,150,0.09);}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#fff8fb;color:var(--text);min-height:100vh;}
button,input,textarea{font:inherit;}
button{cursor:pointer;}
.app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;background:var(--pink-soft);position:relative;padding-bottom:92px;box-shadow:0 0 30px rgba(0,0,0,0.03);}
.header{position:sticky;top:0;z-index:20;height:64px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;background:rgba(255,247,250,0.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:grid;grid-template-columns:48px 1fr 48px;align-items:center;}
.back-btn,.refresh-btn{width:44px;height:44px;border:0;background:white;border-radius:14px;color:var(--pink-dark);font-size:20px;box-shadow:0 4px 14px rgba(210,120,150,0.08);}
.header-title{text-align:center;}
.header-title h1{font-size:18px;font-weight:800;line-height:1.3;}
.header-title p{margin-top:2px;font-size:11px;color:var(--text-light);}
.summary{margin:14px;padding:18px;border-radius:22px;background:radial-gradient( circle at 92% 10%,rgba(255,255,255,.26) 0,rgba(255,255,255,.26) 45px,transparent 46px ),linear-gradient(135deg,#ff79a6,#ff96b8);color:white;box-shadow:var(--shadow);}
.summary-title{font-size:13px;opacity:0.9;}
.summary-number{font-size:30px;font-weight:900;margin-top:5px;}
.summary-number span{font-size:14px;font-weight:600;margin-left:4px;}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px;}
.summary-item{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 5px;text-align:center;}
.summary-item strong{display:block;font-size:17px;margin-bottom:3px;}
.summary-item span{font-size:11px;opacity:.92;}
.filters{padding:0 14px 8px;}
.filter-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-btn{min-width:72px;height:42px;padding:0 14px;border:1px solid var(--border);border-radius:14px;background:white;color:var(--text-light);white-space:nowrap;font-size:13px;font-weight:700;}
.filter-btn.active{background:var(--pink);border-color:var(--pink);color:white;box-shadow:0 5px 14px rgba(255,111,159,.22);}
.content{padding:5px 14px 20px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 12px;}
.section-title h2{font-size:16px;font-weight:800;}
.section-title span{font-size:12px;color:var(--text-light);}
.order-card{background:white;border:1px solid var(--border);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid #f8edf1;}
.merchant{min-width:0;flex:1;}
.merchant-name{font-size:15px;font-weight:800;color:var(--text);line-height:1.45;}
.order-no{margin-top:4px;color:var(--text-light);font-size:11px;word-break:break-all;}
.order-top-actions{flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:6px;}
.complaint-btn{min-width:54px;min-height:32px;padding:5px 10px;border:1px solid #f2b8ca;border-radius:999px;background:#fff5f8;color:#e24e7e;font-size:11px;font-weight:900;white-space:nowrap;}
.complaint-btn:active{transform:scale(.97);}
.complaint-btn.submitted{color:#9b7f89;border-color:#eadde2;background:#f7f3f5;cursor:default;}
.status-badge{flex-shrink:0;min-width:58px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;text-align:center;white-space:nowrap;}
.status-unpaid{color:#b87514;background:#fff5dc;}
.status-paid{color:#247d59;background:#e8f8f0;}
.status-completed{color:#55718e;background:#edf4fb;}
.status-cancelled{color:#8d7e84;background:#f2eef0;}
.status-default{color:var(--pink-dark);background:var(--pink-light);}
.product-area{padding:13px 0 5px;}
.product-name{font-size:15px;font-weight:800;line-height:1.45;}
.meta-row{display:flex;justify-content:space-between;gap:12px;margin-top:9px;font-size:12px;}
.meta-label{color:var(--text-light);flex-shrink:0;}
.meta-value{color:var(--text);text-align:right;font-weight:600;word-break:break-word;}
.amount-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid #f8edf1;}
.time{font-size:11px;color:var(--text-light);}
.amount{text-align:right;}
.amount small{color:var(--text-light);font-size:11px;}
.amount strong{margin-left:4px;font-size:19px;color:var(--pink-dark);}
.usage-box{margin-top:12px;padding:11px 12px;border-radius:14px;background:#fff7fa;}
.usage-top{display:flex;justify-content:space-between;font-size:11px;}
.usage-top span:first-child{color:var(--text-light);}
.usage-top span:last-child{color:var(--pink-dark);font-weight:700;}
.progress{height:6px;margin-top:8px;border-radius:999px;background:#f4dfe7;overflow:hidden;}
.progress-bar{height:100%;background:linear-gradient(90deg,#ff77a5,#ff9bbb);border-radius:999px;}
.card-actions{margin-top:13px;}
.detail-btn{width:100%;min-height:46px;border:0;border-radius:14px;background:#fff0f5;color:var(--pink-dark);font-size:13px;font-weight:800;}
.detail-btn:active{transform:scale(.99);}
.complaint-mask{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(56,38,46,.58);backdrop-filter:blur(6px);}
.complaint-mask.hidden{display:none;}
.complaint-modal{width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding:22px 18px 18px;border-radius:24px;background:white;box-shadow:0 20px 60px rgba(50,20,35,.24);}
.complaint-modal-title{font-size:20px;font-weight:900;color:#513a44;text-align:center;}
.complaint-modal-subtitle{margin-top:7px;color:var(--text-light);font-size:12px;line-height:1.65;text-align:center;}
.complaint-order-info{margin-top:16px;padding:12px 14px;border-radius:14px;background:#fff6f9;border:1px solid #f5dfe7;}
.complaint-order-name{font-size:14px;font-weight:900;color:#523943;}
.complaint-order-no{margin-top:5px;color:var(--text-light);font-size:11px;word-break:break-all;}
.complaint-field{margin-top:17px;}
.complaint-label{display:block;margin-bottom:8px;font-size:13px;font-weight:800;color:#5c424c;}
.required{color:#e5527e;}
.complaint-textarea{width:100%;min-height:135px;resize:vertical;padding:13px;border:1px solid #edd7df;border-radius:15px;outline:none;background:#fffdfd;color:var(--text);font-size:14px;line-height:1.65;}
.complaint-textarea:focus{border-color:#ff91b3;box-shadow:0 0 0 3px rgba(255,111,159,.08);}
.complaint-counter{margin-top:5px;text-align:right;font-size:11px;color:var(--text-light);}
.image-select-box{position:relative;width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;border:1px dashed #efb9ca;border-radius:15px;background:#fff8fa;color:var(--pink-dark);font-size:13px;font-weight:800;overflow:hidden;}
.image-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.image-help{margin-top:7px;color:var(--text-light);font-size:11px;line-height:1.55;}
.image-preview-list{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.image-preview-item{position:relative;aspect-ratio:1 / 1;overflow:hidden;border-radius:12px;border:1px solid #f0dce4;background:#fff6f9;}
.image-preview-item img{width:100%;height:100%;object-fit:cover;display:block;}
.image-remove-btn{position:absolute;top:4px;right:4px;width:25px;height:25px;border:0;border-radius:50%;background:rgba(55,38,45,.75);color:white;font-size:15px;line-height:25px;text-align:center;}
.complaint-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:9px;margin-top:20px;}
.complaint-cancel-btn,.complaint-submit-btn{min-height:48px;border-radius:15px;font-size:14px;font-weight:900;}
.complaint-cancel-btn{border:1px solid #ecd9e0;background:white;color:#8d737d;}
.complaint-submit-btn{border:0;background:linear-gradient(135deg,#ff75a3,#f25c8d);color:white;}
.complaint-submit-btn:disabled,.complaint-cancel-btn:disabled{opacity:.55;cursor:default;}
.state-box{background:white;border:1px solid var(--border);border-radius:22px;padding:38px 20px;text-align:center;box-shadow:var(--shadow);}
.state-icon{font-size:42px;margin-bottom:12px;}
.state-title{font-size:16px;font-weight:800;}
.state-text{margin-top:8px;color:var(--text-light);font-size:12px;line-height:1.7;}
.state-btn{min-width:150px;min-height:46px;margin-top:18px;border:0;border-radius:14px;background:var(--pink);color:white;font-weight:800;}
.loading{padding:50px 20px;text-align:center;color:var(--text-light);font-size:13px;}
.spinner{width:30px;height:30px;margin:0 auto 12px;border:3px solid #f4dfe7;border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}
}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--border);padding:7px 8px max(7px,env(safe-area-inset-bottom));z-index:30;}
.nav-btn{min-height:58px;border:0;background:transparent;color:var(--text-light);border-radius:14px;font-size:11px;font-weight:700;}
.nav-icon{display:block;font-size:20px;margin-bottom:3px;}
.nav-btn.active{color:var(--pink-dark);background:#fff5f8;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);max-width:calc(100% - 40px);padding:11px 16px;border-radius:12px;background:rgba(60,48,53,.94);color:white;font-size:12px;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:2000;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (min-width:481px){body{background:#fff4f8;}
.app{border-left:1px solid #f5e5eb;border-right:1px solid #f5e5eb;}
}
</style><style>
/* 荷序健康：主色深青绿、米白，保留粉色重点和原有图标、状态色。 */
:root{--text:#233633;--text-light:#68766e;--border:#d3dcd4;--shadow:0 5px 20px rgba(16,53,55,.05)}
body,.app{background:#f4f0e6}
.header{background:#0b5051;border-color:#386e63;color:#fffcf7}
.header-title h1{font-family:"Songti SC","STSong",serif;font-weight:500;letter-spacing:1px}
.header-title p{color:#d0e0d8}

.summary-item{border-radius:4px}

.progress{background:#d8e4dc}

.complaint-mask{background:rgba(16,53,55,.55)}
.complaint-modal{background:#fffcf7;border-radius:6px;border:1px solid #afc3b9;box-shadow:0 20px 60px rgba(16,53,55,.2)}
.complaint-modal-title{color:#103537;font-family:"Songti SC","STSong",serif;font-weight:500}
.complaint-order-info{border-radius:4px}
.complaint-order-name,.complaint-label{color:#233633}

.image-select-box,.image-preview-item{border-radius:4px}
.complaint-cancel-btn,.complaint-submit-btn{border-radius:4px}
.complaint-cancel-btn{background:#fffcf7;color:#0b5051;border-color:#afc3b9}
.complaint-submit-btn,.state-btn{background:#0b5051;color:#fff;border-radius:4px}
.bottom-nav{background:rgba(255,252,247,.98)}
.nav-btn{border-radius:4px}
.nav-btn.active{background:#e4eee6;color:#0b5051}
.toast{background:rgba(16,53,55,.96);border-radius:4px}
button:focus-visible{outline:2px solid #478c80;outline-offset:2px}
@media(min-width:481px){body{background:#f4f0e6}.app{border-color:#d3dcd4}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<button class="back-btn" type="button" onclick="goHome()" aria-label="返回" >‹</button>
<div class="header-title">
<h1>我的订单</h1>
<p>全国消费订单统一管理</p>
</div>
<button class="refresh-btn" type="button" onclick="loadPage()" aria-label="刷新" >↻</button>
</header>
<section class="summary">
<div class="summary-title">我的全部订单</div>
<div class="summary-number">
<span id="totalOrderNumber" style="font-size:30px;margin-left:0;">0</span>
<span>笔</span>
</div>
<div class="summary-grid">

<div class="summary-item">

<main class="content">

<nav class="bottom-nav">

<span class="nav-icon">🏠</span>首页</button>
<button class="nav-btn active" type="button" >
<span class="nav-icon">🧾</span>订单</button>

<span class="nav-icon">👤</span>我的</button>
</nav>
</div>
<div id="complaintMask" class="complaint-mask hidden" onclick="handleComplaintMaskClick(event)" >
<div class="complaint-modal" onclick="event.stopPropagation()" >
<div class="complaint-modal-title">提交投诉</div>
<div class="complaint-modal-subtitle">请如实填写投诉内容。提交后平台和对应商户都会收到报警信息。</div>
<div class="complaint-order-info">
<div id="complaintMerchantName" class="complaint-order-name" >-</div>
<div id="complaintOrderNo" class="complaint-order-no" >订单号：-</div>
</div>
<div class="complaint-field">
<label class="complaint-label" for="complaintContent" >投诉内容<span class="required">*</span>
</label><textarea
        id="complaintContent"
        class="complaint-textarea"
        maxlength="3000"
        placeholder="请填写具体投诉内容，例如服务过程、发生时间、存在的问题等。"
        oninput="updateComplaintCounter()"
      ></textarea><div id="complaintCounter" class="complaint-counter" >0 / 3000</div>
</div>

</div>

</div>

<div id="toast" class="toast"></div><script>
const CUSTOMER_SESSION_KEY="hexu_customer_session_v1";
let apiSession=loadApiSession();
let currentUser=null;
let currentCustomer=null;
let allOrders=[];
let currentFilter="all";
let complaintOrder=null;
let complaintFiles=[];
let complaintSubmitting=false;
const COMPLAINT_BUCKET="customer-complaints";
const MAX_COMPLAINT_IMAGES=6;
const MAX_COMPLAINT_FILE_SIZE=5*1024*1024;

function loadApiSession(){
  try{return JSON.parse(localStorage.getItem(CUSTOMER_SESSION_KEY)||"null");}
  catch{return null;}
}
function saveApiSession(value){
  apiSession=value||null;
  if(apiSession)localStorage.setItem(CUSTOMER_SESSION_KEY,JSON.stringify(apiSession));
  else localStorage.removeItem(CUSTOMER_SESSION_KEY);
}
function accessToken(){return apiSession?.access_token||"";}
async function api(path,{method="GET",body,auth=true}={}){
  const headers={Accept:"application/json"};
  if(body!==undefined)headers["Content-Type"]="application/json";
  if(auth){
    const token=accessToken();
    if(!token)throw new Error("请先登录");
    headers.Authorization="Bearer "+token;
  }
  const response=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
  const raw=await response.text();
  let data=null;
  try{data=raw?JSON.parse(raw):null;}catch{data=raw;}
  if(!response.ok){
    const message=data?.message||data?.msg||data?.error_description||data?.error||"请求失败";
    throw new Error(typeof message==="string"?message:"请求失败");
  }
  return data;
}
async function refreshApiSession(){
  if(!apiSession?.refresh_token)return false;
  try{
    const data=await api("/api/auth/refresh",{method:"POST",auth:false,body:{refresh_token:apiSession.refresh_token}});
    if(!data?.access_token)return false;
    saveApiSession({...apiSession,...data});
    return true;
  }catch{return false;}
}
async function apiAuth(path,options={}){
  try{return await api(path,{...options,auth:true});}
  catch(error){
    const message=String(error?.message||"");
    if(/jwt|token|登录状态|unauthorized|401/i.test(message)&&await refreshApiSession()){
      return api(path,{...options,auth:true});
    }
    throw error;
  }
}
function escapeHtml(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function money(value){const n=Number(value||0);return"¥"+n.toFixed(2).replace(/\.00$/,"");}
function formatDate(value){if(!value)return"-";const d=new Date(value);if(Number.isNaN(d.getTime())){return"-";}const month=String(d.getMonth()+1).padStart(2,"0");const day=String(d.getDate()).padStart(2,"0");const hour=String(d.getHours()).padStart(2,"0");const minute=String(d.getMinutes()).padStart(2,"0");return`${month}/${day} ${hour}:${minute}`;}
function showToast(message){const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>{toast.classList.remove("show");},2600);}
function goHome(){window.location.href="./customer.html";}
function openOrder(orderId){if(!orderId)return;window.location.href="./customer_order_detail.html?id="+encodeURIComponent(orderId);}
async function requireCustomerLogin(){
  // 与 customer.html 保持同一套客户 Session / 身份验证逻辑。
  // access_token 暂时失效时先刷新，不再立即跳回 login.html。

  if(!apiSession){
    window.location.replace("./login.html");
    return false;
  }

  if(!apiSession?.access_token){
    const refreshed=await refreshApiSession();
    if(!refreshed){
      saveApiSession(null);
      window.location.replace("./login.html");
      return false;
    }
  }

  try{
    const rows=await apiAuth("/api/customer/profile");
    const profile=Array.isArray(rows)?rows[0]:rows;

    if(!profile){
      saveApiSession(null);
      window.location.replace("./login.html");
      return false;
    }

    if(profile.status&&profile.status!=="active"){
      saveApiSession(null);
      window.location.replace("./login.html");
      return false;
    }

    const isCustomer=
      profile.role==="customer"||
      profile.user_type==="customer";

    if(!isCustomer){
      saveApiSession(null);
      window.location.replace("./login.html");
      return false;
    }

    currentUser=apiSession?.user||{
      id:profile.id,
      phone:""
    };

    return true;

  }catch(error){
    console.error("customer_orders verify customer:",error);

    if(apiSession?.refresh_token){
      const refreshed=await refreshApiSession();

      if(refreshed){
        try{
          const rows=await apiAuth("/api/customer/profile");
          const profile=Array.isArray(rows)?rows[0]:rows;

          const isCustomer=
            profile&&
            (!profile.status||profile.status==="active")&&
            (
              profile.role==="customer"||
              profile.user_type==="customer"
            );

          if(isCustomer){
            currentUser=apiSession?.user||{
              id:profile.id,
              phone:""
            };
            return true;
          }

        }catch(secondError){
          console.error("customer_orders verify customer retry:",secondError);
        }
      }
    }

    saveApiSession(null);
    window.location.replace("./login.html");
    return false;
  }
}
async function loadCustomer(){
  const rows=await apiAuth("/api/customer/record");
  const data=Array.isArray(rows)?rows[0]:rows;
  if(!data)throw new Error("当前登录账号还没有建立客户资料，请重新登录。");
  if(data.status&&data.status!=="active")throw new Error("当前客户账号已停止使用。");
  currentCustomer=data;
}
async function loadOrders(){
  const data=await apiAuth("/api/customer/orders");
  allOrders=Array.isArray(data)?data:[];
  updateSummary();
  renderOrders();
}
function isUnpaid(order){return order.order_status!=="cancelled"&&order.payment_status==="unpaid";}
function isUsing(order){if(isUnpaid(order)){return false;}const remaining=Number(order.remaining_uses||0);return remaining>0&&order.order_status!=="completed"&&order.order_status!=="cancelled";}
function isReview(order){return order.review_status==="pending"&&(order.order_status==="completed"||Number(order.remaining_uses||0)===0);}
function isCompleted(order){return order.order_status==="completed"||Number(order.remaining_uses||0)===0&&!isUnpaid(order);}
function updateSummary(){const total=allOrders.length;const unpaid=allOrders.filter(isUnpaid).length;const using=allOrders.filter(isUsing).length;const review=allOrders.filter(isReview).length;document.getElementById("totalOrderNumber").textContent=total;document.getElementById("unpaidNumber").textContent=unpaid;document.getElementById("usingNumber").textContent=using;document.getElementById("reviewNumber").textContent=review;}
function setFilter(filter,button){currentFilter=filter;document.querySelectorAll(".filter-btn").forEach(btn=>{btn.classList.remove("active");});if(button){button.classList.add("active");}renderOrders();}
function filteredOrders(){switch(currentFilter){case"unpaid":return allOrders.filter(isUnpaid);case"using":return allOrders.filter(isUsing);case"review":return allOrders.filter(isReview);case"completed":return allOrders.filter(isCompleted);default:return allOrders;}}
function filterTitle(){switch(currentFilter){case"unpaid":return"待付款订单";case"using":return"服务中订单";case"review":return"待评价订单";case"completed":return"已完成订单";default:return"全部订单";}}
function getStatus(order){if(order.order_status==="cancelled"){return{text:"已取消",cls:"status-cancelled"};}if(order.payment_status==="unpaid"){return{text:"待付款",cls:"status-unpaid"};}if(order.order_status==="completed"){if(order.review_status==="pending"){return{text:"待评价",cls:"status-default"};}return{text:"已完成",cls:"status-completed"};}if(Number(order.remaining_uses||0)>0){return{text:"服务中",cls:"status-paid"};}return{text:"处理中",cls:"status-default"};}
function recommendationText(order){if(order.recommendation_source_name_snapshot){return order.recommendation_source_name_snapshot;}switch(order.recommendation_source_type){case"merchant":return"商户推荐";case"health_consultant":if(order.recommendation_source_no){return"健康顾问 #"+order.recommendation_source_no;}return"健康顾问";case"platform":default:return"平台";}}
function getProductName(order){const items=Array.isArray(order.items)?order.items:[];if(items.length===0){return"服务订单";}if(items.length===1){return items[0].product_name_snapshot||"服务项目";}const firstName=items[0].product_name_snapshot||"服务项目";return firstName+" 等 "+items.length+" 项";}
function getMerchantName(order){if(order.merchant_name_snapshot){return order.merchant_name_snapshot;}if(order.merchant_no_snapshot){return"服务商户 #"+order.merchant_no_snapshot;}return"服务商户";}
function getPayableAmount(order){const payable=Number(order.payable_amount);if(Number.isFinite(payable)&&payable>=0){return payable;}return Number(order.total_amount||0);}
function usagePercent(order){const total=Number(order.total_uses||1);const used=Number(order.used_uses||0);if(total<=0){return 0;}return Math.max(0,Math.min(100,used/total*100));}
function complaintButtonHtml(order){if(!isCompleted(order)||order.order_status==="cancelled"){return"";}if(order.complaint){return`
      <button
        class="complaint-btn submitted"
        type="button"
        disabled
      >
        已投诉
      </button>
    `;}return`
    <button
      class="complaint-btn"
      type="button"
      onclick="openComplaintModal(
        ${Number(order.id)},
        event
      )"
    >
      投诉
    </button>
  `;}
function renderOrders(){const list=document.getElementById("orderList");const orders=filteredOrders();document.getElementById("listTitle").textContent=filterTitle();document.getElementById("listCount").textContent=orders.length+" 笔";if(orders.length===0){list.innerHTML=`
      <div class="state-box">

        <div class="state-icon">
          🧾
        </div>

        <div class="state-title">
          暂无订单
        </div>

        <div class="state-text">
          当前分类还没有订单。<br>
          您可以返回首页选择服务项目下单。
        </div>

        <button
          class="state-btn"
          type="button"
          onclick="goOrderPage()"
        >
          去下单
        </button>

      </div>
    `;return;}list.innerHTML=orders.map(order=>{const status=getStatus(order);const totalUses=Number(order.total_uses||1);const usedUses=Number(order.used_uses||0);const remainingUses=Number(order.remaining_uses??Math.max(0,totalUses-usedUses));const percent=usagePercent(order);return`
        <article class="order-card">

          <div class="order-top">

            <div class="merchant">

              <div class="merchant-name">
                ${escapeHtml(getMerchantName(order))}
              </div>

              <div class="order-no">
                订单号：
                ${escapeHtml(order.order_no||String(order.id))}
              </div>

            </div>

            <!--
              用户指定位置：
              商户名称右侧，
              投诉按钮在“已完成”标签前面。
            -->
            <div class="order-top-actions">

              ${complaintButtonHtml(order)}

              <span
                class="
                  status-badge
                  ${status.cls}
                "
              >
                ${escapeHtml(status.text)}
              </span>

            </div>

          </div>


          <div class="product-area">

            <div class="product-name">
              ${escapeHtml(getProductName(order))}
            </div>


            <div class="meta-row">

              <span class="meta-label">
                推荐来源
              </span>

              <span class="meta-value">
                ${escapeHtml(recommendationText(order))}
              </span>

            </div>


            <div class="meta-row">

              <span class="meta-label">
                支付状态
              </span>

              <span class="meta-value">
                ${order.payment_status==="paid"?"已支付":order.payment_status==="unpaid"?"未支付":escapeHtml(order.payment_status||"-")}
              </span>

            </div>


            <div class="meta-row">

              <span class="meta-label">
                可消费次数
              </span>

              <span class="meta-value">
                ${totalUses} 次
              </span>

            </div>

          </div>


          <div class="usage-box">

            <div class="usage-top">

              <span>
                消费进度
              </span>

              <span>
                已消费 ${usedUses} 次 ·
                剩余 ${remainingUses} 次
              </span>

            </div>

            <div class="progress">

              <div
                class="progress-bar"
                style="width:${percent}%"
              ></div>

            </div>

          </div>


          <div class="amount-row">

            <div class="time">
              ${escapeHtml(formatDate(order.created_at))}
            </div>

            <div class="amount">

              <small>
                应付金额
              </small>

              <strong>
                ${escapeHtml(money(getPayableAmount(order)))}
              </strong>

            </div>

          </div>


          <div class="card-actions">

            <button
              class="detail-btn"
              type="button"
              onclick="openOrder(
                ${Number(order.id)}
              )"
            >
              查看订单
            </button>

          </div>

        </article>
      `;}).join("");}
function openComplaintModal(orderId,event){if(event){event.preventDefault();event.stopPropagation();}const order=allOrders.find(item=>Number(item.id)===Number(orderId));if(!order){showToast("没有找到该订单。");return;}if(!isCompleted(order)){showToast("只有已完成订单可以投诉。");return;}if(order.complaint){showToast("该订单已经提交过投诉。");return;}complaintOrder=order;complaintFiles=[];document.getElementById("complaintContent").value="";document.getElementById("complaintImages").value="";setComplaintSubmitting(false);updateComplaintCounter();renderComplaintImages();document.getElementById("complaintMerchantName").textContent=getMerchantName(order);document.getElementById("complaintOrderNo").textContent="订单号："+(order.order_no||order.id);document.getElementById("complaintMask").classList.remove("hidden");document.body.style.overflow="hidden";setTimeout(()=>{document.getElementById("complaintContent").focus();},100);}
function closeComplaintModal(){if(complaintSubmitting){return;}document.getElementById("complaintMask").classList.add("hidden");document.body.style.overflow="";complaintOrder=null;complaintFiles=[];}
function handleComplaintMaskClick(event){if(event.target.id==="complaintMask"){closeComplaintModal();}}
function updateComplaintCounter(){const value=document.getElementById("complaintContent").value||"";document.getElementById("complaintCounter").textContent=value.length+" / 3000";}
function handleComplaintImages(event){const selected=Array.from(event.target.files||[]);event.target.value="";if(selected.length===0){return;}for(const file of selected){if(complaintFiles.length>=MAX_COMPLAINT_IMAGES){showToast("每个投诉最多上传6张图片。");break;}if(!["image/jpeg","image/png","image/webp"].includes(file.type)){showToast("只支持 JPG、PNG、WEBP 图片。");continue;}if(file.size>MAX_COMPLAINT_FILE_SIZE){showToast("单张图片不能超过5MB。");continue;}const duplicate=complaintFiles.some(oldFile=>oldFile.name===file.name&&oldFile.size===file.size&&oldFile.lastModified===file.lastModified);if(duplicate){continue;}complaintFiles.push(file);}renderComplaintImages();}
function renderComplaintImages(){const container=document.getElementById("imagePreviewList");container.innerHTML="";complaintFiles.forEach((file,index)=>{const wrapper=document.createElement("div");wrapper.className="image-preview-item";const image=document.createElement("img");const url=URL.createObjectURL(file);image.src=url;image.alt="投诉图片";image.onload=()=>{URL.revokeObjectURL(url);};const removeButton=document.createElement("button");removeButton.type="button";removeButton.className="image-remove-btn";removeButton.textContent="×";removeButton.onclick=()=>{if(complaintSubmitting){return;}complaintFiles.splice(index,1);renderComplaintImages();};wrapper.appendChild(image);wrapper.appendChild(removeButton);container.appendChild(wrapper);});}
function setComplaintSubmitting(submitting){complaintSubmitting=submitting;const submitButton=document.getElementById("complaintSubmitButton");const cancelButton=document.getElementById("complaintCancelButton");submitButton.disabled=submitting;cancelButton.disabled=submitting;submitButton.textContent=submitting?"正在提交...":"提交投诉";}
function getFileExtension(file){switch(file.type){case"image/png":return"png";case"image/webp":return"webp";case"image/jpeg":default:return"jpg";}}
function makeComplaintFileName(file,index){const extension=getFileExtension(file);const randomPart=window.crypto&&typeof window.crypto.randomUUID==="function"?window.crypto.randomUUID().replace(/-/g,""):Date.now().toString(36)+Math.random().toString(36).slice(2);return String(index+1).padStart(2,"0")+"_"+randomPart+"."+extension;}
async function uploadComplaintImage(){throw new Error("投诉图片接口正在迁移，请稍后再试。");}
async function submitComplaint(){
  if(complaintSubmitting||!complaintOrder)return;
  showToast("投诉接口正在统一到客户API，请稍后再试。");
}
function goOrderPage(){window.location.href="./qr_login.html";}
function showError(error){console.error(error);const message=error?.message||String(error)||"页面加载失败";document.getElementById("orderList").innerHTML=`
    <div class="state-box">

      <div class="state-icon">
        ⚠️
      </div>

      <div class="state-title">
        订单读取失败
      </div>

      <div class="state-text">
        ${escapeHtml(message)}
      </div>

      <button
        class="state-btn"
        type="button"
        onclick="loadPage()"
      >
        重新加载
      </button>

    </div>
  `;}
async function loadPage(){try{document.getElementById("orderList").innerHTML=`
      <div class="loading">
        <div class="spinner"></div>
        正在读取订单...
      </div>
    `;const loggedIn=await requireCustomerLogin();if(!loggedIn){return;}await loadCustomer();await loadOrders();}catch(error){showError(error);}}
document.addEventListener("DOMContentLoaded",loadPage);
</script></body>
