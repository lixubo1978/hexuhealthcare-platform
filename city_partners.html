<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市合伙人｜荷序健康</title>
<style>
:root{--g:#0b5051;--c:#f4f0e6;--p:#fffcf7;--l:#d3dcd4;--m:#64716a}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#233633;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{height:76px;background:var(--p);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:21px;font-weight:700;color:var(--g)}button{cursor:pointer}.btn{height:38px;padding:0 14px;border:1px solid var(--l);background:#fff;color:var(--g)}.primary{background:var(--g);color:#fff}.main{max-width:1440px;margin:auto;padding:28px}.hero{background:var(--g);color:#fff;padding:26px 30px}.hero h1{font:400 29px "Songti SC","STSong",serif;margin:5px 0}.hero p{font-size:12px;color:#c6dbd0}.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--p);border:1px solid var(--l);border-top:0}.stat{padding:15px 18px;border-right:1px solid var(--l)}.stat label{font-size:10px;color:var(--m)}.stat b{display:block;margin-top:5px;font-size:22px;color:var(--g)}.period{display:grid;grid-template-columns:repeat(5,1fr) 2.2fr;margin-top:22px;border:1px solid var(--l);background:var(--p)}.tab{height:44px;border:0;border-right:1px solid var(--l);background:#f8f6ef;color:var(--m);font-weight:700}.tab.active{background:var(--g);color:#fff}.custom{display:flex;align-items:center;gap:6px;padding:5px 8px}.custom input{width:100%;height:32px;border:1px solid var(--l)}.panel{margin-top:18px;background:var(--p);border:1px solid var(--l)}.head{padding:15px 18px;border-bottom:1px solid var(--l);font:400 21px "Songti SC","STSong",serif}.filters{display:grid;grid-template-columns:220px 1fr 180px;gap:8px;padding:12px;background:#eaf0e9}.filters input,.filters select{height:40px;border:1px solid var(--l);background:#fff;padding:0 10px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1080px}th,td{padding:12px;border-bottom:1px solid #e0e5df;text-align:left;font-size:12px}th{background:#edf2e9;color:#53665c;font-size:10px}.name,.money{font-weight:700;color:var(--g)}.badge{padding:3px 8px;background:#e4efea;color:var(--g);font-size:10px}.mask{display:none;position:fixed;inset:0;background:#10353799;z-index:50;padding:24px;align-items:center;justify-content:center}.mask.show{display:flex}.modal{width:min(1180px,96vw);max-height:92vh;overflow:auto;background:var(--p)}.mh{position:sticky;top:0;background:var(--g);color:#fff;padding:17px 20px;display:flex;justify-content:space-between}.detail{padding:18px}.dg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--l)}.di{padding:12px;border-right:1px solid var(--l)}.di label{display:block;font-size:10px;color:var(--m)}.di b{display:block;margin-top:5px;color:var(--g)}.sec{margin-top:18px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:5px 9px;background:#e5efe8;color:var(--g);font-size:11px}.loading{position:fixed;inset:0;background:#f4f0e6dd;display:none;place-items:center;z-index:100}.loading.show{display:grid}
</style></head><body>
<header class="top"><div class="brand">荷序健康 · 城市合伙人</div><div><button class="btn" onclick="location.href='wholemanagement.html'">返回工作台</button> <button class="btn primary" onclick="logout()">退出</button></div></header>
<main class="main"><section class="hero"><h1>城市合伙人全国管理</h1><p>查看全部城市合伙人的授权城市、管辖门店、技术人员和经营数据。</p></section>
<section class="stats"><div class="stat"><label>城市合伙人总数</label><b id="s1">0</b></div><div class="stat"><label>正常合伙人</label><b id="s2">0</b></div><div class="stat"><label>覆盖城市</label><b id="s3">0</b></div><div class="stat"><label>管辖门店</label><b id="s4">0</b></div><div class="stat"><label>管理技术人员</label><b id="s5">0</b></div></section>
<section class="period"><button class="tab" onclick="setP('day',this)">本日</button><button class="tab" onclick="setP('week',this)">本周</button><button class="tab active" onclick="setP('month',this)">本月</button><button class="tab" onclick="setP('quarter',this)">本季度</button><button class="tab" onclick="setP('year',this)">本年度</button><div class="custom"><input id="from" type="date"><span>至</span><input id="to" type="date"><button class="btn" onclick="setCustom()">查询</button></div></section>
<section class="panel"><div class="head">全部城市合伙人</div><div class="filters"><select id="city" onchange="render()"><option value="">全部已开通城市</option></select><input id="q" placeholder="搜索编号、姓名、邮箱" oninput="render()"><select id="status" onchange="render()"><option value="">全部状态</option><option value="active">正常</option><option value="inactive">停用</option></select></div><div class="wrap"><table><thead><tr><th>编号</th><th>城市合伙人</th><th>登录邮箱</th><th>状态</th><th>授权城市</th><th>管辖门店</th><th>管理技师</th><th>预期订单总额</th><th>预期合伙人收入</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<div id="mask" class="mask"><div class="modal"><div class="mh"><b id="title">城市合伙人详情</b><button class="btn" onclick="closeM()">关闭</button></div><div id="detail" class="detail"></div></div></div><div id="loading" class="loading">正在读取数据…</div>
<script>
const KEY="sb-qbuqjwpkltbjhlfbyjyb-auth-token";let list=[],stats={},pt="month";const $=x=>document.getElementById(x),money=x=>"¥"+Number(x||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
function tok(){try{return JSON.parse(localStorage.getItem(KEY)||"null")?.access_token||""}catch{return""}}
async function api(p){const r=await fetch(p,{headers:{Authorization:"Bearer "+tok(),Accept:"application/json"},cache:"no-store"}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"请求失败");return d}
function rg(t,a,b){let s=new Date(),e=new Date();s.setHours(0,0,0,0);e.setHours(0,0,0,0);if(t==="day")e.setDate(e.getDate()+1);else if(t==="week"){s.setDate(s.getDate()-((s.getDay()+6)%7));e=new Date(s);e.setDate(e.getDate()+7)}else if(t==="month"){s.setDate(1);e=new Date(s);e.setMonth(e.getMonth()+1)}else if(t==="quarter"){s.setMonth(Math.floor(s.getMonth()/3)*3,1);e=new Date(s);e.setMonth(e.getMonth()+3)}else if(t==="year"){s.setMonth(0,1);e=new Date(s);e.setFullYear(e.getFullYear()+1)}else{s=new Date(a+"T00:00:00");e=new Date(b+"T00:00:00");e.setDate(e.getDate()+1)}return{s:s.toISOString(),e:e.toISOString()}}
async function loadStats(){const r=rg(pt,$("from").value,$("to").value);stats={};await Promise.all(list.map(async x=>{try{stats[x.id]=await api(`/api/admin/city-partners/analytics?citypartner_id=${x.id}&start=${encodeURIComponent(r.s)}&end=${encodeURIComponent(r.e)}`)}catch{stats[x.id]={}}}))}
async function load(){$("loading").classList.add("show");try{const me=await api("/api/auth/business-identity");if(!["founder","platform_admin"].includes(me.role))throw Error("没有权限");list=(await api("/api/admin/city-partners")).city_partners||[];const cityMap=new Map();list.forEach(x=>(x.cities||[]).forEach(c=>cityMap.set(String(c.id),c)));$("city").innerHTML=`<option value="">全部已开通城市</option>${[...cityMap.values()].sort((a,b)=>String(a.city_name||"").localeCompare(String(b.city_name||""),"zh-CN")).map(c=>`<option value="${c.id}">${c.city_name}</option>`).join("")}`;$("s1").textContent=list.length;$("s2").textContent=list.filter(x=>x.status==="active").length;$("s3").textContent=new Set(list.flatMap(x=>(x.cities||[]).map(c=>c.id))).size;$("s4").textContent=list.reduce((a,x)=>a+Number(x.merchant_count||0),0);$("s5").textContent=list.reduce((a,x)=>a+Number(x.managed_technician_count||0),0);await loadStats();render()}catch(e){alert("读取失败："+e.message)}finally{$("loading").classList.remove("show")}}
function render(){const city=$("city").value,q=$("q").value.toLowerCase(),st=$("status").value,a=list.filter(x=>(!city||(x.cities||[]).some(c=>String(c.id)===String(city)))&&(!st||x.status===st)&&(!q||[x.citypartner_no,x.citypartner_name,x.profile?.login_email,(x.cities||[]).map(c=>c.city_name).join(" ")].join(" ").toLowerCase().includes(q)));$("rows").innerHTML=a.map(x=>{const z=stats[x.id]||{};return `<tr><td>${x.citypartner_no||"—"}</td><td class="name">${x.citypartner_name||"—"}</td><td>${x.profile?.login_email||"—"}</td><td><span class="badge">${x.status==="active"?"正常":"停用"}</span></td><td>${(x.cities||[]).map(c=>c.city_name).join("、")||"—"}</td><td>${x.merchant_count||0}</td><td>${x.managed_technician_count||0}</td><td class="money">${money(z.order_total)}</td><td class="money">${money(z.citypartner_income)}</td><td><button class="btn" onclick="openD(${x.id})">查看详情</button></td></tr>`}).join("")}
async function setP(t,b){pt=t;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("loading").classList.add("show");await loadStats();render();$("loading").classList.remove("show")}async function setCustom(){if(!$("from").value||!$("to").value)return alert("请选择日期");pt="custom";document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));$("loading").classList.add("show");await loadStats();render();$("loading").classList.remove("show")}
async function openD(id){$("loading").classList.add("show");try{const x=await api("/api/admin/city-partners/detail?id="+id),cp=x.city_partner,z=stats[id]||{},mm=new Map((x.merchants||[]).map(m=>[String(m.id),m])),pm=new Map((x.products||[]).map(p=>[String(p.id),p]));$("title").textContent=cp.citypartner_name+" · 城市合伙人详情";$("detail").innerHTML=`<div class="dg"><div class="di"><label>编号</label><b>${cp.citypartner_no||"—"}</b></div><div class="di"><label>邮箱</label><b>${x.profile?.login_email||"—"}</b></div><div class="di"><label>状态</label><b>${cp.status==="active"?"正常":"停用"}</b></div><div class="di"><label>预期合伙人收入</label><b>${money(z.citypartner_income)}</b></div></div><div class="sec"><h4>授权城市</h4><div class="chips">${(x.cities||[]).map(c=>`<span class="chip">${c.city_name}</span>`).join("")||"—"}</div></div><div class="sec"><h4>管辖门店与项目</h4><div class="wrap"><table><tr><th>门店</th><th>项目</th><th>合伙人比例</th><th>版本</th></tr>${(x.rules||[]).map(r=>`<tr><td>${mm.get(String(r.merchant_id))?.merchant_name||"—"}</td><td>${pm.get(String(r.product_id))?.product_name||"—"}</td><td>${Number(r.city_manager_ratio||0)}%</td><td>V${r.version_no||1}</td></tr>`).join("")}</table></div></div><div class="sec"><h4>当前管理技术人员</h4><div class="wrap"><table><tr><th>编号</th><th>姓名</th><th>状态</th><th>关系</th></tr>${(x.technicians||[]).map(t=>`<tr><td>${t.technician_no||"—"}</td><td>${t.technician_name||"—"}</td><td>${t.status||"—"}</td><td>${t.created_by_citypartner&&t.serving_managed_merchant?"本人创建 + 管辖门店服务":t.created_by_citypartner?"本人创建":"管辖门店服务"}</td></tr>`).join("")}</table></div></div>`;$("mask").classList.add("show")}catch(e){alert(e.message)}finally{$("loading").classList.remove("show")}}
function closeM(){$("mask").classList.remove("show")}function logout(){localStorage.removeItem(KEY);location.href="login.html"}document.addEventListener("DOMContentLoaded",load);
</script></body></html>
