<script>
let businessBusy=false,merchantPasswordClient=null,merchantPasswordUserId=null,merchantPasswordBusy=false;
const INITIAL_MERCHANT_PASSWORD="12345678";
const customerTab=document.getElementById("customerTab"),businessTab=document.getElementById("businessTab"),customerPanel=document.getElementById("customerPanel"),businessPanel=document.getElementById("businessPanel"),customerPhone=document.getElementById("customerPhone"),customerOtp=document.getElementById("customerOtp"),sendOtpButton=document.getElementById("sendOtpButton"),customerLoginButton=document.getElementById("customerLoginButton"),customerMessage=document.getElementById("customerMessage"),businessAccount=document.getElementById("businessAccount"),businessPassword=document.getElementById("businessPassword"),businessLoginButton=document.getElementById("businessLoginButton"),businessMessage=document.getElementById("businessMessage"),passwordToggle=document.getElementById("passwordToggle");
const SUPABASE_URL="https://qbuqjwpkltbjhlfbyjyb.supabase.co",SUPABASE_ANON_KEY="sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3",PAGE_PLATFORM="./wholemanagement.html",PAGE_MERCHANT="./merchantplatform.html",PAGE_HEALTH_CONSULTANT="./healthconsultant.html",PAGE_TECHNICIAN="./technician.html",PAGE_CUSTOMER="./customer.html",PLATFORM_ROLES=["founder","platform_admin","platform_staff","province_admin","city_admin"];
let supabaseClient=null,otpCountdown=0,otpTimer=null;
function initializeSupabase(){try{if(!window.supabase||typeof window.supabase.createClient!=="function")return false;supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true;}catch(error){console.error("Supabase初始化失败：",error);supabaseClient=null;return false;}}

function normalizeChinaPhone(value){let phone=String(value||"").replace(/\D/g,"");if(phone.startsWith("86")&&phone.length===13)phone=phone.substring(2);return /^1\d{10}$/.test(phone)?"+86"+phone:null;}
function isValidEmail(value){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);}
function normalizeBusinessAccount(value){const account=String(value||"").trim().toLowerCase();if(/^\d{6,12}$/.test(account))return{email:`${account}@consultant.yunnaixin.internal`,type:"system_id",display:account};if(isValidEmail(account))return{email:account,type:"email",display:account};return null;}
function setButtonLoading(button,loading,text){button.disabled=loading;if(loading)button.innerHTML='<span class="spinner"></span>'+text;else button.textContent=text;}
async function sendOtp(){clearMessage(customerMessage);if(!requireSupabase(customerMessage))return;const phone=normalizeChinaPhone(customerPhone.value);if(!phone){showMessage(customerMessage,"请输入正确的11位手机号码。","error");customerPhone.focus();return;}sendOtpButton.disabled=true;sendOtpButton.textContent="发送中...";try{const{error}=await supabaseClient.auth.signInWithOtp({phone,options:{shouldCreateUser:true}});if(error)throw error;showMessage(customerMessage,"验证码已经发送，请查看手机短信。","success");startOtpCountdown();}catch(error){console.error("发送验证码失败：",error);showMessage(customerMessage,getReadableError(error),"error");sendOtpButton.disabled=false;sendOtpButton.textContent="获取验证码";}}
function startOtpCountdown(){if(otpTimer)clearInterval(otpTimer);otpCountdown=60;sendOtpButton.disabled=true;updateOtpButton();otpTimer=setInterval(()=>{otpCountdown--;updateOtpButton();if(otpCountdown<=0){clearInterval(otpTimer);otpTimer=null;sendOtpButton.disabled=false;sendOtpButton.textContent="重新获取";}},1000);}
function updateOtpButton(){if(otpCountdown>0)sendOtpButton.textContent=otpCountdown+"秒";}
async function ensureCustomerRecord(phone){const{data,error}=await supabaseClient.rpc("ensure_customer_record",{p_phone:phone});if(error)throw error;if(!data||data.success!==true)throw new Error("客户资料初始化失败。");return data;}
async function getCurrentIdentity(client=supabaseClient){const{data:userData,error:userError}=await client.auth.getUser();if(userError)throw userError;const user=userData?.user;if(!user)throw new Error("无法获取登录用户信息。");const{data:profile,error:profileError}=await client.from("profiles").select("id,role,status,full_name,login_email").eq("id",user.id).maybeSingle();if(profileError)console.warn("读取profiles失败：",profileError);if(profile){if(profile.status!=="active")throw new Error("该账号当前已被停用。");if(!profile.role)throw new Error("账号尚未配置用户角色，请联系平台管理员。");return{role:profile.role,status:profile.status,profile,user};}const authRole=String(user.app_metadata?.role||user.user_metadata?.account_type||"");if(authRole==="health_consultant"||authRole==="service_technician")return{role:authRole,status:"active",profile:null,user,mustChangePassword:user.user_metadata?.must_change_password===true};throw new Error("该账号尚未建立平台身份资料，请联系管理员。");}
async function getCurrentUserRole(){return(await getCurrentIdentity()).role;}
function redirectByRole(role){if(PLATFORM_ROLES.includes(role)){window.location.replace(PAGE_PLATFORM);return;}if(role==="merchant"){window.location.replace(PAGE_MERCHANT);return;}if(role==="health_consultant"){window.location.replace(PAGE_HEALTH_CONSULTANT);return;}if(role==="service_technician"){window.location.replace(PAGE_TECHNICIAN);return;}if(role==="customer"){window.location.replace(PAGE_CUSTOMER);return;}throw new Error("当前账号角色无法识别。");}
async function customerLogin(){clearMessage(customerMessage);if(!requireSupabase(customerMessage))return;const phone=normalizeChinaPhone(customerPhone.value),token=String(customerOtp.value||"").trim();if(!phone){showMessage(customerMessage,"请输入正确的手机号码。","error");customerPhone.focus();return;}if(!/^\d{6}$/.test(token)){showMessage(customerMessage,"请输入6位短信验证码。","error");customerOtp.focus();return;}setButtonLoading(customerLoginButton,true,"正在登录");try{const{data,error}=await supabaseClient.auth.verifyOtp({phone,token,type:"sms"});if(error)throw error;if(!data?.user||!data?.session)throw new Error("登录失败，请重新获取验证码。");const customerResult=await ensureCustomerRecord(phone),role=await getCurrentUserRole();if(role!=="customer"){await supabaseClient.auth.signOut();throw new Error("该手机账号不是客户账号，请使用商户 / 顾问 / 管理入口登录。");}showMessage(customerMessage,customerResult.created?`注册成功，您的客户编号为 ${customerResult.customer_no}。`:"登录成功。","success");setTimeout(()=>window.location.replace(PAGE_CUSTOMER),350);}catch(error){console.error("客户登录失败：",error);try{const{data}=await supabaseClient.auth.getSession();if(data?.session)await supabaseClient.auth.signOut();}catch(signOutError){console.error(signOutError);}showMessage(customerMessage,getReadableError(error),"error");setButtonLoading(customerLoginButton,false,"登录");}}
async function businessLogin(){if(businessBusy||merchantPasswordClient)return;clearMessage(businessMessage);if(!requireSupabase(businessMessage))return;const account=normalizeBusinessAccount(businessAccount.value),password=String(businessPassword.value||"");if(!account){showMessage(businessMessage,"请输入正确的邮箱或系统ID。","error");businessAccount.focus();return;}if(!password){showMessage(businessMessage,"请输入登录密码。","error");businessPassword.focus();return;}businessBusy=true;setButtonLoading(businessLoginButton,true,"正在验证");let client=supabaseClient;try{if(password===INITIAL_MERCHANT_PASSWORD)client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"ynx-initial-password-login"}});const{data,error}=await client.auth.signInWithPassword({email:account.email,password});if(error)throw error;if(!data?.user||!data?.session)throw new Error("登录失败，请重新尝试。");const identity=await getCurrentIdentity(client);if(identity.user.id!==data.user.id)throw new Error("登录状态已变化，请重新登录。");if(identity.role==="customer"){await client.auth.signOut();throw new Error("客户账号请使用手机验证码登录。");}if(!PLATFORM_ROLES.includes(identity.role)&&!["merchant","health_consultant","service_technician"].includes(identity.role)){await client.auth.signOut();throw new Error("该账号没有平台认可的登录角色。");}businessPassword.value="";if(identity.role==="merchant"&&password===INITIAL_MERCHANT_PASSWORD){openInitialMerchantPassword(client,identity.user.id);return;}await acceptBusinessSession(client);redirectByRole(identity.role);}catch(error){console.error("账号密码登录失败：",error);try{const{data}=await client.auth.getSession();if(data?.session)await client.auth.signOut();}catch(signOutError){console.error(signOutError);}showMessage(businessMessage,getReadableError(error),"error");setButtonLoading(businessLoginButton,false,"登录");}finally{businessBusy=false;}}
function getReadableError(error){const original=String(error?.message||""),message=original.toLowerCase();if(message.includes("invalid login credentials"))return"邮箱、系统ID或密码错误。";if(message.includes("email not confirmed"))return"该登录账户尚未完成确认。";if(message.includes("token has expired")||message.includes("otp expired"))return"验证码已经失效，请重新获取。";if(message.includes("invalid token")||message.includes("token is invalid"))return"验证码错误，请重新输入。";if(message.includes("rate limit")||message.includes("too many requests"))return"操作过于频繁，请稍后再试。";if(message.includes("already bound")||message.includes("已经绑定"))return"该手机号已经绑定其他客户账号，请联系平台处理。";if(message.includes("user_type"))return"登录页面版本过旧，请刷新页面重新登录。";return original||"登录失败，请稍后重新尝试。";}

async function autoRedirectExistingSession(){if(!supabaseClient||businessBusy||merchantPasswordClient)return;try{const{data,error}=await supabaseClient.auth.getSession();if(error||!data?.session||businessBusy||merchantPasswordClient)return;const user=data.session.user;if(user?.phone){try{await ensureCustomerRecord(user.phone);}catch(customerError){console.error("自动补齐客户记录失败：",customerError);}}const role=await getCurrentUserRole();if(businessBusy||merchantPasswordClient)return;redirectByRole(role);}catch(error){if(businessBusy||merchantPasswordClient)return;console.error("自动登录检测失败：",error);try{await supabaseClient.auth.signOut();}catch(signOutError){console.error(signOutError);}}}
setupInitialPasswordForm();
autoRedirectExistingSession();
async function acceptBusinessSession(client){if(client===supabaseClient)return;const{data,error}=await client.auth.getSession();if(error)throw error;if(!data?.session)throw new Error("登录已过期，请重新登录。");const result=await supabaseClient.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});if(result.error)throw result.error;if(!result.data?.session||result.data.session.user?.id!==data.session.user?.id)throw new Error("登录状态异常，请重新登录。");}
function openInitialMerchantPassword(client,userId){merchantPasswordClient=client;merchantPasswordUserId=userId;document.getElementById("merchantNewPassword").value=document.getElementById("merchantConfirmPassword").value="";clearMessage(document.getElementById("merchantPasswordMessage"));document.querySelector(".page").inert=true;document.getElementById("merchantPasswordGate").hidden=false;document.getElementById("merchantNewPassword").focus();}
async function saveInitialMerchantPassword(event){event?.preventDefault();if(merchantPasswordBusy||!merchantPasswordClient)return;const message=document.getElementById("merchantPasswordMessage"),first=document.getElementById("merchantNewPassword"),second=document.getElementById("merchantConfirmPassword"),password=first.value;clearMessage(message);if(!password){showMessage(message,"请输入新密码。","error");first.focus();return;}if(password===INITIAL_MERCHANT_PASSWORD){showMessage(message,"请设置一个不同于初始密码的新密码。","error");first.focus();return;}if(password!==second.value){showMessage(message,"两次输入的密码不一致。","error");second.focus();return;}const button=document.getElementById("merchantPasswordSave"),exit=document.getElementById("merchantPasswordExit"),client=merchantPasswordClient,userId=merchantPasswordUserId;merchantPasswordBusy=true;exit.disabled=true;setButtonLoading(button,true,"正在保存");try{const identity=await getCurrentIdentity(client);if(identity.role!=="merchant"||identity.user.id!==userId)throw new Error("登录状态已变化，请退出后重新登录。");const{data,error}=await client.auth.updateUser({password});if(error)throw error;if(data?.user?.id!==userId)throw new Error("密码更新结果无法确认，请重新登录。");first.value=second.value=businessPassword.value="";try{await acceptBusinessSession(client);window.location.replace(PAGE_MERCHANT);}catch(sessionError){try{await client.auth.signOut({scope:"local"});}catch(signOutError){console.error(signOutError);}closeInitialMerchantPassword();showMessage(businessMessage,"密码已修改，请使用新密码重新登录。","info");businessPassword.focus();}}catch(error){showMessage(message,getReadableError(error),"error");}finally{merchantPasswordBusy=false;exit.disabled=false;setButtonLoading(button,false,"保存并进入工作台");}}
async function exitInitialMerchantPassword(){if(merchantPasswordBusy||!merchantPasswordClient)return;const exit=document.getElementById("merchantPasswordExit");merchantPasswordBusy=true;exit.disabled=true;try{const{error}=await merchantPasswordClient.auth.signOut({scope:"local"});if(error)throw error;closeInitialMerchantPassword();businessAccount.focus();}catch(error){showMessage(document.getElementById("merchantPasswordMessage"),getReadableError(error),"error");}finally{merchantPasswordBusy=false;exit.disabled=false;}}
function closeInitialMerchantPassword(){merchantPasswordClient=null;merchantPasswordUserId=null;document.getElementById("merchantNewPassword").value=document.getElementById("merchantConfirmPassword").value=businessPassword.value="";document.getElementById("merchantPasswordGate").hidden=true;document.querySelector(".page").inert=false;setButtonLoading(businessLoginButton,false,"登录");openBusinessTab();}
function setupInitialPasswordForm(){document.getElementById("merchantPasswordForm").onsubmit=saveInitialMerchantPassword;document.getElementById("merchantPasswordExit").onclick=exitInitialMerchantPassword;document.addEventListener("keydown",event=>{const gate=document.getElementById("merchantPasswordGate");if(gate.hidden)return;if(event.key==="Escape"){event.preventDefault();return;}if(event.key!=="Tab")return;const items=[...gate.querySelectorAll("input:not([disabled]),button:not([disabled])")],first=items[0],last=items[items.length-1];if(!first)return;if(!gate.contains(document.activeElement)){event.preventDefault();first.focus();}else if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}});}
</script></body></html>
