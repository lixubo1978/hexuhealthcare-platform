<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>消费核销 - 荷序健康</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- QR 扫描 -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #fff7fa;
            color: #45363d;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "PingFang SC",
                "Microsoft YaHei",
                Arial,
                sans-serif;
        }

        body {
            padding-bottom:
                calc(30px + env(safe-area-inset-bottom));
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            background:
                linear-gradient(
                    180deg,
                    #ffeaf2 0px,
                    #fff7fa 260px,
                    #fff7fa 100%
                );
        }

        /* =========================
           顶部
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 50;

            min-height: 62px;

            padding:
                calc(10px + env(safe-area-inset-top))
                16px
                10px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                rgba(255,255,255,.96);

            border-bottom:
                1px solid #f4dce5;

            backdrop-filter:
                blur(12px);
        }

        .header-side {
            width: 80px;
        }

        .header-side.right {
            text-align: right;
        }

        .back-btn {
            min-height: 42px;
            padding: 0;
            border: none;
            background: transparent;
            color: #dc5a87;
            font-size: 14px;
            font-weight: 800;
        }

        .header-title {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            color: #513841;
        }

        /* =========================
           主体
        ========================= */

        .content {
            padding: 16px;
        }

        .merchant-card {
            padding: 18px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #ff709e,
                    #ff93b4
                );

            color: white;

            box-shadow:
                0 12px 30px
                rgba(230,85,132,.20);
        }

        .merchant-label {
            font-size: 12px;
            opacity: .86;
        }

        .merchant-name {
            margin-top: 5px;
            font-size: 22px;
            font-weight: 900;
        }

        .merchant-no {
            margin-top: 9px;

            display: inline-flex;

            min-height: 28px;

            align-items: center;

            padding: 5px 10px;

            border-radius: 10px;

            background:
                rgba(255,255,255,.18);

            font-size: 12px;
            font-weight: 800;
        }

        /* =========================
           卡片
        ========================= */

        .card {
            margin-top: 14px;
            padding: 18px;

            background: white;

            border:
                1px solid #f2dce5;

            border-radius: 22px;

            box-shadow:
                0 7px 24px
                rgba(100,60,75,.06);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 14px;

            font-size: 16px;
            font-weight: 900;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f16896;
        }

        .tip {
            font-size: 12px;
            color: #987783;
            line-height: 1.7;
        }

        /* =========================
           扫码区
        ========================= */

        #reader {
            width: 100%;
            margin-top: 14px;

            overflow: hidden;

            border-radius: 18px;

            background: #f8f8f8;
        }

        #reader video {
            border-radius: 18px;
        }

        .scanner-btn {
            width: 100%;
            min-height: 50px;

            margin-top: 14px;

            border: none;
            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #ff719e,
                    #f45c8f
                );

            color: white;

            font-size: 15px;
            font-weight: 900;
        }

        .scanner-btn.stop {
            background: #fff0f5;
            color: #d65984;
            border: 1px solid #f0d5df;
        }

        /* =========================
           手动输入
        ========================= */

        .token-input {
            width: 100%;
            min-height: 48px;

            margin-top: 12px;

            padding: 10px 13px;

            border:
                1px solid #ecd7df;

            border-radius: 14px;

            outline: none;

            background: #fffafd;

            font-size: 13px;

            color: #553c46;
        }

        .token-input:focus {
            border-color: #f0769f;

            box-shadow:
                0 0 0 3px
                rgba(240,118,159,.10);
        }

        .verify-btn {
            width: 100%;
            min-height: 48px;

            margin-top: 10px;

            border: none;
            border-radius: 15px;

            background: #ffedf4;
            color: #d75281;

            font-size: 14px;
            font-weight: 900;
        }

        /* =========================
           核销结果
        ========================= */

        .result-card {
            margin-top: 14px;

            padding: 20px 18px;

            border-radius: 22px;

            background: #effcf5;

            border:
                1px solid #ceeeda;
        }

        .result-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #dff7e9;

            color: #248659;

            font-size: 30px;
            font-weight: 900;
        }

        .result-title {
            margin-top: 12px;

            text-align: center;

            color: #237b53;

            font-size: 21px;
            font-weight: 900;
        }

        .result-desc {
            margin-top: 6px;

            text-align: center;

            color: #688779;

            font-size: 13px;
        }

        .result-order {
            margin-top: 17px;

            padding: 12px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.75);

            text-align: center;

            color: #5e7167;

            font-size: 12px;

            word-break: break-all;
        }

        .usage-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-top: 14px;
        }

        .usage-item {
            padding: 13px 6px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.80);

            text-align: center;
        }

        .usage-value {
            font-size: 21px;
            font-weight: 900;
            color: #2b8b61;
        }

        .usage-label {
            margin-top: 4px;

            font-size: 10px;
            color: #789285;
        }

        .verification-no {
            margin-top: 13px;

            padding: 10px 12px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.75);

            font-size: 11px;
            line-height: 1.6;

            color: #658073;
        }

        .continue-btn {
            width: 100%;
            min-height: 48px;

            margin-top: 15px;

            border: none;
            border-radius: 15px;

            background: #36a574;
            color: white;

            font-size: 14px;
            font-weight: 900;
        }

        /* =========================
           错误
        ========================= */

        .error-card {
            margin-top: 14px;

            padding: 18px;

            border-radius: 18px;

            background: #fff0f3;

            border:
                1px solid #f3ccd8;

            color: #b84e70;

            font-size: 13px;
            line-height: 1.7;
        }

        /* =========================
           Loading
        ========================= */

        .loading-mask {
            position: fixed;
            inset: 0;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(255,247,250,.96);
        }

        .loading-content {
            text-align: center;
        }

        .loading-icon {
            font-size: 42px;

            animation:
                pulse 1s infinite
                ease-in-out;
        }

        .loading-text {
            margin-top: 10px;

            font-size: 13px;

            color: #9b7484;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (min-width: 700px) {

            body {
                background: #f6f1f3;
            }

            .page {
                box-shadow:
                    0 0 35px
                    rgba(80,45,60,.08);
            }
        }
    </style>
<style>
/* 荷序健康：深青绿/米白主色，保留粉色点缀、原图标及核销状态色。 */
html,body,.page{background:#f4f0e6;color:#233633}
.header{background:#0b5051;border-color:#386e63}
.back-btn,.header-title{color:#fffcf7}
.header-title{font-family:"Songti SC","STSong",serif;font-weight:500;letter-spacing:1px}
.merchant-card{background:linear-gradient(110deg,#073a3c,#0b5051 65%,#205955);border-radius:4px;box-shadow:0 8px 26px rgba(16,53,55,.08)}
.merchant-name{font-family:"Songti SC","STSong",serif;font-weight:500}
.merchant-no{border-radius:4px}
.card{background:#fffcf7;border-color:#d3dcd4;border-radius:4px;box-shadow:0 5px 20px rgba(16,53,55,.05)}
.card-title{color:#103537}.tip,.loading-text{color:#68766e}
#reader,#reader video{border-radius:4px}
.scanner-btn{background:#0b5051;color:#fff;border-radius:4px}
.scanner-btn.stop{background:#fff0f5;color:#b63c69;border-color:#e8bbcb}
.token-input{background:#fff;color:#233633;border-color:#c5d3c9;border-radius:4px}
.token-input:focus{border-color:#478c80;box-shadow:0 0 0 3px rgba(11,80,81,.09)}
.verify-btn{background:#e4eee6;color:#0b5051;border:1px solid #c5d3c9;border-radius:4px}
.result-card,.result-order,.usage-item,.verification-no,.continue-btn,.error-card{border-radius:4px}
.loading-mask{background:rgba(244,240,230,.96)}
button:focus-visible{outline:2px solid #478c80;outline-offset:3px}
@media(min-width:700px){body{background:#f4f0e6}.page{box-shadow:0 0 35px rgba(16,53,55,.07)}}
</style>
</head>


<body>


<!-- ========================================================
     Loading
======================================================== -->

<div
    id="loadingMask"
    class="loading-mask"
>

    <div class="loading-content">

        <div class="loading-icon">
            🌸
        </div>

        <div class="loading-text">
            正在进入核销系统...
        </div>

    </div>

</div>


<div class="page">


    <!-- ========================================================
         顶部
    ======================================================== -->

    <header class="header">

        <div class="header-side">

            <button
                class="back-btn"
                type="button"
                onclick="goBack()"
            >
                ← 返回
            </button>

        </div>


        <div class="header-title">
            消费核销
        </div>


        <div class="header-side right"></div>

    </header>


    <main class="content">


        <!-- ====================================================
             商户
        ==================================================== -->

        <section class="merchant-card">

            <div class="merchant-label">
                当前核销商户
            </div>

            <div
                id="merchantName"
                class="merchant-name"
            >
                -
            </div>

            <div
                id="merchantNo"
                class="merchant-no"
            >
                商户编号：-
            </div>

        </section>


        <!-- ====================================================
             扫码
        ==================================================== -->

        <section
            id="scannerCard"
            class="card"
        >

            <div class="card-title">

                <span class="dot"></span>

                扫描客户消费二维码

            </div>


            <div class="tip">
                请使用手机摄像头扫描客户订单页面上的消费二维码。
                每成功核销一次，系统只扣减 1 次服务次数。
            </div>


            <div
                id="reader"
            ></div>


            <button
                id="scannerButton"
                class="scanner-btn"
                type="button"
                onclick="toggleScanner()"
            >
                开始扫码
            </button>

        </section>


        <!-- ====================================================
             手工调试
        ==================================================== -->

        <section class="card">

            <div class="card-title">

                <span class="dot"></span>

                手工核销

            </div>


            <div class="tip">
                开发调试时，可以直接粘贴消费二维码中的 Token。
                正式使用时主要通过摄像头扫码。
            </div>


            <input
                id="tokenInput"
                class="token-input"
                type="text"
                autocomplete="off"
                placeholder="粘贴 verification_token"
            >


            <button
                id="manualVerifyButton"
                class="verify-btn"
                type="button"
                onclick="manualVerify()"
            >
                确认核销
            </button>

        </section>


        <!-- ====================================================
             成功
        ==================================================== -->

        <section
            id="resultCard"
            class="result-card hidden"
        >

            <div class="result-icon">
                ✓
            </div>


            <div
                id="resultTitle"
                class="result-title"
            >
                核销成功
            </div>


            <div
                id="resultDesc"
                class="result-desc"
            >
                本次服务已经完成核销。
            </div>


            <div
                id="resultOrder"
                class="result-order"
            >
                -
            </div>


            <div class="usage-grid">

                <div class="usage-item">

                    <div
                        id="resultTotal"
                        class="usage-value"
                    >
                        0
                    </div>

                    <div class="usage-label">
                        总次数
                    </div>

                </div>


                <div class="usage-item">

                    <div
                        id="resultUsed"
                        class="usage-value"
                    >
                        0
                    </div>

                    <div class="usage-label">
                        已使用
                    </div>

                </div>


                <div class="usage-item">

                    <div
                        id="resultRemaining"
                        class="usage-value"
                    >
                        0
                    </div>

                    <div class="usage-label">
                        剩余次数
                    </div>

                </div>

            </div>


            <div
                id="verificationInfo"
                class="verification-no"
            ></div>


            <button
                class="continue-btn"
                type="button"
                onclick="continueScanning()"
            >
                继续核销下一笔
            </button>

        </section>


        <!-- ====================================================
             错误
        ==================================================== -->

        <section
            id="errorCard"
            class="error-card hidden"
        ></section>


    </main>


</div>


<script>

    /* ========================================================
       Supabase
    ======================================================== */

    const SUPABASE_URL =
        "https://qbuqjwpkltbjhlfbyjyb.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_fqMc6n_yKymvZEb-6u6DDQ_CJZpEbl3";


    const sb =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* ========================================================
       全局
    ======================================================== */

    let currentUser = null;

    let currentMerchant = null;

    let html5QrCode = null;

    let scannerRunning = false;

    let verificationBusy = false;


    const IDLE_LIMIT =
        10 * 60 * 1000;


    let idleTimer = null;


    /* ========================================================
       初始化
    ======================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        init
    );


    async function init() {

        try {

            setupIdleLogout();


            const {
                data: sessionData,
                error: sessionError
            } =
                await sb.auth.getSession();


            if (
                sessionError
                ||
                !sessionData?.session?.user
            ) {

                goLogin();

                return;
            }


            currentUser =
                sessionData.session.user;


            const allowed =
                await loadMerchant();


            if (!allowed) {

                showFatalError(
                    "当前账号不是有效商户账号。"
                );

                hideLoading();

                return;
            }


            renderMerchant();


            hideLoading();


        } catch (error) {

            console.error(
                "核销页面初始化失败：",
                error
            );


            showFatalError(
                error?.message
                ||
                "页面加载失败"
            );


            hideLoading();
        }
    }


    /* ========================================================
       商户验证
    ======================================================== */

    async function loadMerchant() {

        const {
            data,
            error
        } =
            await sb
                .from("merchants")
                .select(`
                    id,
                    auth_user_id,
                    merchant_code,
                    merchant_name,
                    status,
                    record_no
                `)
                .eq(
                    "auth_user_id",
                    currentUser.id
                )
                .eq(
                    "status",
                    "active"
                )
                .maybeSingle();


        if (error) {

            console.error(
                "读取商户失败：",
                error
            );

            return false;
        }


        if (!data) {

            return false;
        }


        currentMerchant =
            data;


        return true;
    }


    function renderMerchant() {

        document.getElementById(
            "merchantName"
        ).textContent =
            currentMerchant.merchant_name
            ||
            "商户";


        const merchantNo =
            currentMerchant.record_no
            ??
            currentMerchant.merchant_code
            ??
            "-";


        document.getElementById(
            "merchantNo"
        ).textContent =
            `商户编号：${merchantNo}`;
    }


    /* ========================================================
       扫码
    ======================================================== */

    async function toggleScanner() {

        if (
            scannerRunning
        ) {

            await stopScanner();

            return;
        }


        await startScanner();
    }


    async function startScanner() {

        clearError();


        if (
            scannerRunning
        ) {

            return;
        }


        try {

            if (
                !html5QrCode
            ) {

                html5QrCode =
                    new Html5Qrcode(
                        "reader"
                    );
            }


            const config = {

                fps:
                    10,

                qrbox:
                    {
                        width:
                            230,

                        height:
                            230
                    },

                aspectRatio:
                    1
            };


            await html5QrCode.start(

                {
                    facingMode:
                        "environment"
                },

                config,

                onScanSuccess,

                () => {
                    /* 忽略每帧未识别错误 */
                }

            );


            scannerRunning =
                true;


            const button =
                document.getElementById(
                    "scannerButton"
                );


            button.textContent =
                "停止扫码";


            button.classList.add(
                "stop"
            );


        } catch (error) {

            console.error(
                "启动摄像头失败：",
                error
            );


            showError(
                "无法打开摄像头。请确认浏览器已经允许摄像头权限，并使用 HTTPS 打开页面。"
            );
        }
    }


    async function stopScanner() {

        if (
            !html5QrCode
            ||
            !scannerRunning
        ) {

            return;
        }


        try {

            await html5QrCode.stop();

        } catch (error) {

            console.warn(
                "停止扫码：",
                error
            );
        }


        scannerRunning =
            false;


        const button =
            document.getElementById(
                "scannerButton"
            );


        button.textContent =
            "开始扫码";


        button.classList.remove(
            "stop"
        );
    }


    async function onScanSuccess(
        decodedText
    ) {

        if (
            verificationBusy
        ) {

            return;
        }


        const token =
            normalizeToken(
                decodedText
            );


        if (!token) {

            return;
        }


        /*
         * 扫到以后先停止摄像头，
         * 防止同一个二维码连续识别多次。
         */

        await stopScanner();


        await verifyToken(
            token
        );
    }


    /* ========================================================
       手工核销
    ======================================================== */

    async function manualVerify() {

        if (
            verificationBusy
        ) {

            return;
        }


        const raw =
            document
                .getElementById(
                    "tokenInput"
                )
                .value;


        const token =
            normalizeToken(
                raw
            );


        if (!token) {

            showError(
                "请输入有效的消费核销 Token。"
            );

            return;
        }


        await verifyToken(
            token
        );
    }


    /* ========================================================
       Token兼容处理
    ======================================================== */

    function normalizeToken(
        raw
    ) {

        let value =
            String(
                raw ?? ""
            ).trim();


        if (!value) {

            return null;
        }


        /*
         * 当前二维码内容直接是Token。
         *
         * 以后如果二维码改成URL，例如：
         *
         * https://yunnaixin.com/verify?t=xxxx
         *
         * 这里仍然兼容。
         */

        if (
            value.startsWith(
                "http://"
            )
            ||
            value.startsWith(
                "https://"
            )
        ) {

            try {

                const url =
                    new URL(
                        value
                    );


                const token =
                    url.searchParams.get(
                        "t"
                    )
                    ||
                    url.searchParams.get(
                        "token"
                    );


                if (token) {

                    value =
                        token.trim();
                }

            } catch (error) {

                console.warn(
                    "二维码URL解析失败",
                    error
                );
            }
        }


        if (
            value.length < 20
        ) {

            return null;
        }


        return value;
    }


    /* ========================================================
       正式核销
    ======================================================== */

    async function verifyToken(
        token
    ) {

        if (
            verificationBusy
        ) {

            return;
        }


        verificationBusy =
            true;


        clearError();


        setVerifyButtons(
            true
        );


        try {

            const {
                data,
                error
            } =
                await sb.rpc(
                    "verify_service_order",
                    {
                        p_verification_token:
                            token
                    }
                );


            if (error) {

                throw new Error(
                    error.message
                    ||
                    "核销失败"
                );
            }


            if (
                !data
                ||
                data.success !== true
            ) {

                throw new Error(
                    data?.message
                    ||
                    "核销失败"
                );
            }


            renderSuccess(
                data
            );


            document
                .getElementById(
                    "tokenInput"
                )
                .value =
                "";


        } catch (error) {

            console.error(
                "订单核销失败：",
                error
            );


            showError(
                cleanDatabaseError(
                    error?.message
                    ||
                    "核销失败"
                )
            );


        } finally {

            verificationBusy =
                false;


            setVerifyButtons(
                false
            );
        }
    }


    /* ========================================================
       成功结果
    ======================================================== */

    function renderSuccess(
        data
    ) {

        const card =
            document.getElementById(
                "resultCard"
            );


        card.classList.remove(
            "hidden"
        );


        const completed =
            data.completed === true;


        document.getElementById(
            "resultTitle"
        ).textContent =
            completed
            ?
            "核销成功 · 服务已完成"
            :
            "核销成功";


        document.getElementById(
            "resultDesc"
        ).textContent =
            completed
            ?
            "这是本订单最后一次服务，本订单已经自动完成。"
            :
            `这是本订单第 ${data.verification_no ?? data.verification_sequence ?? "-"} 次核销。`;


        document.getElementById(
            "resultOrder"
        ).textContent =
            `订单号：${data.order_no ?? data.order_id ?? "-"}`;


        document.getElementById(
            "resultTotal"
        ).textContent =
            Number(
                data.total_uses
                ??
                0
            );


        document.getElementById(
            "resultUsed"
        ).textContent =
            Number(
                data.used_uses
                ??
                0
            );


        document.getElementById(
            "resultRemaining"
        ).textContent =
            Number(
                data.remaining_uses
                ??
                0
            );


        const code =
            data.verification_code
            ??
            data.verification_no
            ??
            "-";


        document.getElementById(
            "verificationInfo"
        ).innerHTML =
            `
            核销流水：${escapeHtml(code)}
            <br>
            核销时间：${escapeHtml(
                formatDateTime(
                    data.verified_at
                )
            )}
            `;


        /*
         * 成功后滚动到结果区域
         */

        setTimeout(
            () => {

                card.scrollIntoView(
                    {
                        behavior:
                            "smooth",

                        block:
                            "center"
                    }
                );

            },
            80
        );
    }


    /* ========================================================
       继续下一单
    ======================================================== */

    async function continueScanning() {

        document
            .getElementById(
                "resultCard"
            )
            .classList
            .add("hidden");


        clearError();


        await startScanner();
    }


    /* ========================================================
       按钮状态
    ======================================================== */

    function setVerifyButtons(
        busy
    ) {

        const manual =
            document.getElementById(
                "manualVerifyButton"
            );


        manual.disabled =
            busy;


        manual.textContent =
            busy
            ?
            "正在核销..."
            :
            "确认核销";


        const scannerButton =
            document.getElementById(
                "scannerButton"
            );


        scannerButton.disabled =
            busy;
    }


    /* ========================================================
       错误
    ======================================================== */

    function showError(
        message
    ) {

        const card =
            document.getElementById(
                "errorCard"
            );


        card.textContent =
            message;


        card.classList.remove(
            "hidden"
        );


        setTimeout(
            () => {

                card.scrollIntoView(
                    {
                        behavior:
                            "smooth",

                        block:
                            "center"
                    }
                );

            },
            50
        );
    }


    function showFatalError(
        message
    ) {

        showError(
            message
        );


        document
            .getElementById(
                "scannerCard"
            )
            .classList
            .add("hidden");
    }


    function clearError() {

        document
            .getElementById(
                "errorCard"
            )
            .classList
            .add("hidden");
    }


    function cleanDatabaseError(
        message
    ) {

        let text =
            String(
                message
                ||
                "核销失败"
            );


        /*
         * PostgreSQL / Supabase
         * 有时候会在异常后面带SQL上下文，
         * 客户端只显示最前面的业务提示。
         */

        text =
            text.split(
                "\n"
            )[0];


        return text;
    }


    /* ========================================================
       返回
    ======================================================== */

    async function goBack() {

        await stopScanner();


        window.location.href =
            "./merchantplatform.html";
    }


    /* ========================================================
       登录
    ======================================================== */

    function goLogin() {

        window.location.replace(
            "./login.html"
        );
    }


    /* ========================================================
       10分钟退出
    ======================================================== */

    function setupIdleLogout() {

        const events = [

            "click",
            "touchstart",
            "touchmove",
            "keydown",
            "scroll"

        ];


        events.forEach(
            eventName => {

                document.addEventListener(
                    eventName,
                    resetIdleTimer,
                    {
                        passive:
                            true
                    }
                );
            }
        );


        resetIdleTimer();
    }


    function resetIdleTimer() {

        if (
            idleTimer
        ) {

            clearTimeout(
                idleTimer
            );
        }


        idleTimer =
            setTimeout(
                logoutByIdle,
                IDLE_LIMIT
            );
    }


    async function logoutByIdle() {

        try {

            await stopScanner();


            await sb.auth.signOut();


        } catch (error) {

            console.error(
                "自动退出失败：",
                error
            );


        } finally {

            window.location.href =
                "./login.html?reason=idle";
        }
    }


    /* ========================================================
       工具
    ======================================================== */

    function hideLoading() {

        const mask =
            document.getElementById(
                "loadingMask"
            );


        mask.style.opacity =
            "0";


        mask.style.transition =
            "opacity .2s ease";


        setTimeout(
            () => {

                mask.style.display =
                    "none";

            },
            220
        );
    }


    function formatDateTime(
        value
    ) {

        if (!value) {

            return "-";
        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(
                value
            );
        }


        return date.toLocaleString(
            "zh-CN",
            {
                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    false
            }
        );
    }


    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }

</script>

</body>
