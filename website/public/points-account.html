<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的积分与服务券 · 荷序健康</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6ef;color:#263d32;font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1000px;margin:35px auto;padding:0 22px 70px}a{color:#426c54}header{display:flex;justify-content:space-between;align-items:center;gap:20px}header img{width:155px;height:65px;object-fit:contain}h1{font:500 34px/1.4 "Songti SC",serif}h2{font-size:21px}section,.panel{padding:25px;background:#fffefa;border:1px solid #dfe8dc;border-radius:18px;margin:20px 0}p{color:#65756a}.balances{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.balances article{padding:18px;background:#edf2e9;border-radius:12px}.balances strong{display:block;font-size:29px;color:#426c54}button,.button{font:inherit;border:0;border-radius:9px;background:#426c54;color:white;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.55;cursor:default}input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid #cbd8c8;border-radius:8px;background:white}label{display:block;margin:15px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.check{display:flex;gap:10px;align-items:start;font-size:14px}.check input{width:auto;margin-top:7px}.hint{font-size:14px}.tickets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.ticket{border:1px solid #dfe8dc;border-radius:12px;padding:16px;overflow-wrap:anywhere}.ticket img{display:block;width:180px;max-width:100%;margin:auto}.record{padding:12px 0;border-bottom:1px solid #e4e8df}.hidden-trap{position:absolute;left:-9999px}#status,#formStatus{white-space:pre-line;color:#426c54}@media(max-width:600px){.balances{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr;gap:0}.tickets{grid-template-columns:repeat(2,1fr)}section{padding:18px}h1{font-size:28px}}</style><link rel="stylesheet" href="order-guide.css"></head><body><main><header><a href="index.html"><img src="assets/he-xu-logo-transparent.png" alt="荷序健康"></a><a href="points.html">返回小荷有礼</a></header><a class="guide-trigger" href="/guide/order" data-order-guide><strong>第一次下单？35秒看懂</strong><span>观看操作指南 ▶</span></a><h1>我的小荷积分</h1><p>每次服务完成后，积分陪伴日常生活。</p><div class="balances"><article>可用积分<strong id="available">—</strong></article><article>待到账<strong id="pending">—</strong></article><article>暂冻结<strong id="frozen">—</strong></article><article>待冲回<strong id="recovery">—</strong></article></div><p id="status" role="status">正在连接积分账户…</p><button id="refresh" type="button">刷新账户</button><section><h2>我的服务券</h2><p class="hint">单次、三次、五次套餐分别对应1、3、5张服务券。完成一次服务后，再出示对应券由门店核销。</p><div id="tickets" class="tickets"></div></section><section><h2>积分明细</h2><div id="ledger"></div></section><section><h2>需要总部协助？</h2><p>复杂争议或在线退款无法完成，可提交总部协调；协商后的线下退款同步更新订单及相关积分。</p><a class="button" href="disputes.html">提交售后与争议申请</a></section></main><script src="rewards-config.js"></script><script src="points-account.js" defer></script><script src="order-guide.js"></script></body></html>
