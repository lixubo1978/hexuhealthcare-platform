<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="查看荷序已入驻门店的门头、内部环境、简介及特色项目，申请合作。"><title>门店展示管理｜荷序健康</title><link rel="stylesheet" href="stores.css"></head><body><header><div class="wrap"><a href="index.html" aria-label="荷序健康首页"><img src="assets/he-xu-logo-transparent.png" alt="荷序健康"></a><nav><a href="stores.html">逛逛门店</a><a href="service-guide.html">服务指南</a><a href="cooperation-apply.html">申请合作</a><a href="index.html">首页</a></nav></div></header><main class="wrap"><div class="intro"><div><h1>门店展示管理</h1><p>维护真实门店资料，选择重点展示的三家门店。</p></div><a class="button outline" href="stores.html">查看门店页</a></div><p id="adminStatus" class="status" role="status">正在核实管理权限…</p><a id="loginLink" class="button" target="_top" href="/signin-with-chatgpt?return_to=/stores-admin.html" hidden>管理员登录</a><div id="adminBody" hidden><section class="formbox"><h2 id="formTitle">添加入驻门店</h2><form id="storeForm"><input type="hidden" name="id"><div class="fields"><label>门店名称 *<input name="name" required minlength="2" maxlength="100"></label><label>所在地区 *<input name="region" required minlength="2" maxlength="150" placeholder="省市区县与门店位置"></label><label class="full">门店简介 *<textarea name="description" rows="4" required minlength="10" maxlength="1500"></textarea></label><div class="full"><label>门头图片链接 *<input name="coverUrl" required placeholder="上传图片或填写HTTPS链接"></label><div class="uploads"><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp"><button type="button" id="uploadCover" class="outline">上传门头图片</button></div></div><div class="full"><label>内部环境图片链接 *<textarea name="interiorUrls" rows="3" required placeholder="每行一个图片链接，最多8张"></textarea></label><div class="uploads"><input id="interiorFile" type="file" accept="image/jpeg,image/png,image/webp" multiple><button type="button" id="uploadInterior" class="outline">上传内部图片</button></div></div><label class="full">特色项目 *<textarea name="projects" rows="5" required placeholder="每行填写：项目名称 | 项目介绍
如：项目名称 | 服务内容、适用场景与特色说明"></textarea></label><label>重点展示位置<select name="featuredRank"><option value="0">普通展示</option><option value="1">重点第1位</option><option value="2">重点第2位</option><option value="3">重点第3位</option></select></label><label>发布状态<select name="published"><option value="false">暂存草稿</option><option value="true">发布已入驻门店</option></select></label></div><label class="check"><input type="checkbox" name="confirmedReal" required><span>我已核实门店资料真实、已获公开展示授权；发布时门店已通过平台入驻审核。图片不含客户隐私，介绍不夸大服务效果。</span></label><button type="submit">保存门店资料</button> <button type="button" id="newStore" class="outline">新增门店</button><p class="hint">图片支持JPG、PNG、WEBP，单张最大8MB。重点排序并列时按更新时间和门店编号排序；建议只选择三家重点门店。后续同步原程序时，以原程序的审核及资料为准。</p></form></section><section class="formbox"><h2>门店资料列表</h2><button type="button" id="refreshStores" class="outline">刷新列表</button><div id="adminStores"></div></section></div></main><footer><div class="wrap">荷序健康 · 门店资料及可预约项目，以审核发布后的信息为准。<a href="stores-admin.html" id="adminLink" hidden>门店管理</a></div></footer><script src="stores-admin.js" defer></script></body></html>
