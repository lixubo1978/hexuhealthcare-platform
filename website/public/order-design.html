<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择服务 · 荷序健康</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="order-design.css"><link rel="stylesheet" href="order-guide.css"></head><body>
<div class="previewbar">新版点单演示 · 展示资料为样例，不生成订单 <button id="editImages" type="button">更换项目图片</button></div>
<header class="top"><a href="index.html" class="brand"><img src="assets/he-xu-logo-transparent.png" alt="荷序健康"></a><a href="index.html">返回首页</a></header>
<main class="shell"><section class="hero"><div><p class="eyebrow">荷序健康</p><h1>把安心的服务，<br>放在你身边。</h1><p>选好项目、门店与服务人员，<br class="mobile">开启你的社区健康服务。</p></div></section>
<a class="guide-trigger" href="/guide/order" data-order-guide><strong>第一次下单？35秒看懂</strong><span>观看操作指南 ▶</span></a><section class="location"><div><span class="locationlabel">服务城市</span><strong>南通市</strong><span class="hint">展示样例</span></div><button type="button" id="cityHelp">选择城市</button></section>
<section class="catalog"><div class="sectionhead"><div><h2>选择服务项目</h2><p>看看适合自己的服务</p></div><span id="projectCount"></span></div><div class="cataloglayout"><nav class="categories" aria-label="服务分类" id="categories"></nav><div id="projects" class="projects"></div></div></section>
</main><footer class="orderbar"><div><span>已选 <b id="selectedCount">0</b> 份</span><strong id="total">¥0</strong></div><button type="button" id="next" disabled>下一步，选择门店</button></footer>
<dialog id="flow"><div class="dialoghead"><div><p id="stepCount" class="eyebrow"></p><h2 id="stepTitle"></h2></div><button class="close" type="button" id="closeFlow" aria-label="关闭">×</button></div><div id="stepBody"></div><p id="flowError" role="status"></p><div class="dialogactions"><button id="back" type="button">上一步</button><button id="continue" class="primary" type="button">下一步</button></div></dialog>
<dialog id="details"><div class="dialoghead"><h2 id="detailTitle"></h2><button type="button" class="close" id="closeDetails" aria-label="关闭详情">×</button></div><div id="detailGallery" class="detailgallery"></div><p id="detailDescription"></p><p class="hint">图片与说明为版式样例，正式内容由平台审核发布。</p></dialog>
<dialog id="editor"><div class="dialoghead"><h2>项目操作图片</h2><button class="close" type="button" id="closeEditor" aria-label="关闭图片编辑">×</button></div><p>选择项目，再插入自己的操作照片。当前替换只用于本机演示，刷新后恢复；正式上传由工程师接入后台。</p><label>选择项目<select id="imageProject"></select></label><label>插入操作图片（最多6张）<input id="imageFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><p id="imageStatus" role="status"></p><button class="primary" id="restoreImages" type="button">恢复样例图片</button></dialog>
<div id="toast" role="status"></div><script src="order-design-data.js"></script><script src="order-design.js"></script><script src="order-guide.js"></script></body></html>
